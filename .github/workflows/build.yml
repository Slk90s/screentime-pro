            - **Windows**：onnxruntime 运行库 **+** det/rec 模型**全部随包** —— 零下载、断网可用
            - **macOS / Linux**：det/rec 模型**随包**；平台运行库（`libonnxruntime.dylib` / `libonnxruntime.so`）改为**首次使用增强引擎时后台静默下载**（约 40MB / 29MB，带 SHA256 校验），落到用户缓存目录后复用
            - 下载失败**绝不阻断取字**：自动回落「标准」引擎并给出提示，不会让截图流程崩溃
            - 🎯 **零上传红线不变**：任何平台都不上传用户数据、不传图；mac / Linux 仅下载自身运行库这一次性文件
