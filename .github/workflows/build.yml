            #### 📊 包体积
            | 项目 | 优化前 | 优化后 |
            |---|---|---|
            | 前端 `dist` | 5.08 MB | 1.17 MB（−77%） |
            | 桌宠图片（16 张） | 5.30 MB | 0.64 MB（−88%） |
            > 完整版本历史见仓库 README。
          releaseDraft: false
          prerelease: false
          release: true
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: |
            src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage
            src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/deb/*.deb

  # ---------- macOS (Apple Silicon) ----------
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install frontend deps
        run: npm ci --no-audit --no-fund
      - name: Build Tauri (macOS)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --ci --target aarch64-apple-darwin
          tagName: "v__VERSION__"
          releaseName: "v__VERSION__"
          releaseBody: |
            ### 屏幕时间管家 ScreenTime Pro — v1.2.5
            #### 🚀 体积与性能优化（本版重点）
            - **安装包与前端资源大幅瘦身**：桌宠皮肤帧图由 PNG 换为 WebP（q80 + alpha 无损）。实测 **16 张图 5.30 MB → 0.64 MB（省 88.0%）**，前端构建产物 `dist` **5.08 MB → 1.17 MB（省 77%）**，其中图片体积占比从 87.0% 降到 43.6%。透明通道经逐像素比对**零损失**（alpha MAE 0.000），半透明边缘 RGB 平均差 2.73/255（约 1%），肉眼不可辨；蜘蛛侠皮肤为二值 alpha，alpha 与边缘 RGB 均无误差
