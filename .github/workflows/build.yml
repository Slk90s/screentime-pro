      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: |
            src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage
            src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/deb/*.deb

  # ---------- macOS (Apple Silicon) ----------
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install frontend deps
        run: npm ci --no-audit --no-fund
      - name: Build Tauri (macOS)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --ci --target aarch64-apple-darwin
          tagName: "v__VERSION__"
          releaseName: "v__VERSION__"
          releaseBody: |
            ### 屏幕时间管家 ScreenTime Pro — v1.2.10

            > 本版为 **macOS 交互体验专项修复**（浮窗浅色反色 / 菜单栏图标 / 权限中心 / 更新检测加固）。Windows / Linux 无功能改动，可不升级。

            #### 🐞 修复一：浮窗在 macOS 浅色外观下白字看不清（P0）

            **症状**：系统切到浅色外观、桌面是浅色壁纸时，悬浮指标条的白字与底几乎同亮度，读不出来。

            **根因**：CSS 里字号、颜色、压暗量全是按深色背景定的，**没有跟随 `prefers-color-scheme` 分档**。实测白字在浅色壁纸的玻璃底上只有 1.36:1（WCAG 正文线 4.5:1）。

            **为什么不能靠"降 alpha"解决**：压暗层加深到 0.48 后，白字在纯白壁纸上仍只有 3.40:1；即使加到 0.80 也才 3.9 上下 —— 数学上永远过不了 4.5。**唯一出路是反色**（亮底深字）。

            **修法**：新增 `@media (prefers-color-scheme: light)` 档，白遮罩 + 近黑文字（`#1c1c1e`，正是 NSColor.labelColor 的浅色值）。

            - ⚠️ **反色只挂在 `.has-blur` 上（= 只有 macOS），Windows 不参与**。三个理由：① Windows 上没有任何系统材质跟随 appearance（DWM 对无边框窗透光率仅 0.001，已刻意不调用），CSS 是唯一视觉来源；② 反色在深色壁纸上**大幅变差** —— Win11 默认 Bloom 壁纸 rgb(46,32,78) 上现状 16.78:1，照搬本档参数只剩 **6.32:1**，净亏 10.5，且胶囊会变成一块 srgb(161,155,175) 的灰白板；③ 与关闭玻璃时的深色胶囊 `rgba(28,30,38,.86)` 外观割裂。
            - 配色定标：材质后底下界由 v1.2.8 深色真机实测**反推**（压暗 0.48 后观测 L≈95/71，除以 0.52 → 183/137），按 137 保守取值并扫全程 130~255 取最差：主数字 10.38 / 标签 5.16 / 网速↓ 4.74 / 网速↑ 4.82 / 截图 5.49，**全部过 AA**。
            - 网速色比初版更深（`#0a658c`→`#055a70`、`#8a4d08`→`#7a4405`）：初版在材质底 <162/153 时会掉到 4.06/4.20:1。

            #### 🐞 修复二：浮窗高度与圆角有"两个源"

            **症状**：冷启动或开关翻转时，胶囊底部会露出 8px 系统材质；玻璃档圆角处看着像两道弧。

            **根因**：窗口高度由 Rust `set_size` 下发（36 或 44），而 CSS 里又硬编码了 `height:36px` / `.is-glass { height:44px }`。两条时间线不同源，任何一刻两边不一致就露馅。圆角同理（材质 radius 22 vs CSS 18）。

            **修法**：`.float-bar` 改成 `height:100%` + `border-radius:999px`，删除 `.is-glass` 里残留的 `44px / 22px`。**高度只剩一处定义**，跟随 Rust 下发的值 —— 与 v1.2.8 对宽度做的改造完全同构。

            #### 🐞 修复三：菜单栏图标在浅色栏上显得脏灰

            **症状**：macOS 菜单栏切到浅色时，应用图标是一枚橙色的不透明色块，观感"脏"。用户原话「状态栏在浅色位置有点太灰了」。

            **根因**：托盘取的是 `default_window_icon()`（彩色 App 图标，alpha=255 占 90.6%）。它在浅色菜单栏上对比度只有 1.91:1 —— 一块糊在栏上的色块。

            **修法**：macOS 改用 **template 剪影图**（纯黑 + alpha 的圆环 + 圆心）。系统会按菜单栏明暗自动染色，浅色栏显深、深色栏显浅，任何壁纸下都清晰。

            - 新增 `icons/trayTemplate.png`(22²) / `@2x`(44²)，4x 超采样绘制后 LANCZOS 缩小。有效覆盖率 25.0% / 25.1%，与理论值 24.8% 误差 <0.3%。
            - macOS 分支内嵌 **@2x（44×44）**：`tray-icon 0.24.2` 的 macOS 实现是单张 `NSImage::initWithData`，无法表达 1x/2x 多表示；系统会把图标高度缩到固定 18pt，44px 下采样比 22px 上采样锐利。
            - ⚠️ 非 macOS 仍用原 App 图标 —— template 是 macOS 专属语义。

            #### ✨ 新增：设置页「权限中心」（仅 macOS）

            截图卡片之后新增只读卡片：屏幕录制 / 辅助功能两项的真实状态 + 手动刷新 + 「授予」（跳系统设置）/「重置并重启」。刻意**不轮询** —— `check_permissions` 在未放行时会 fork codesign/xattr，1Hz 轮询代价过高。含 ad-hoc 签名专项提示（升级后授权失效的物理成因是 cdhash 每次构建都变）。

            #### 🐞 修复四：检测不到版本更新

            三个独立成因，本版全部处理：

            1. **只查一次**：前端原来只用一个 `setTimeout`，在常驻托盘的应用里等于"进程一生只检查一次"。改为 6 小时 `setInterval`。
            2. **时间戳烧掉了窗口**：原写法在「抓取成功」后就写时间戳 —— 包括「已是最新」的情况，导致接下来 24 小时不再检查。改为「确认远端状态」之后才写，并把节流从 24h 收到 6h。
            3. **读不到系统代理**：`reqwest` 用了 `default-features = false`，连带丢掉了默认集里的 `system-proxy`，于是只认 `HTTP_PROXY` 环境变量、**不读操作系统代理设置**。Clash / Surge 这类 GUI 客户端默认改的是系统代理 → 用户以为"开着代理"，进程实际直连出境 → 三条通道全灭 → 前端报「已是最新」。**已补上 `system-proxy` feature。**

            另外：

            - 三通道抓取，全部失败才算失败：GitHub `releases.atom` → GitHub REST API → **Gitee 镜像**。GitHub 在部分网络环境不可达，Gitee 是本项目既有的发布落点。
            - 每条通道都加 `is_version_tag` 校验：`ocr-runtime` 这类「非版本号的资源型 Release」会让前端弹出「发现新版本 ocr-runtime」的死链。
            - `semver_gt` 修正 dismissed 自愈：`!semver_gt(&dismissed, &current)` 依赖「相等返回 false」，否则忽略过的版本会永久不再提示。
            - 错误正文截断按**字符**而非字节（`String::truncate` 按字节切且非 char 边界会 panic，不能用）。

            #### 🐞 修复五：权限弹窗反复弹

            删除启动 3 秒的预请求（判据是单信号 `CGPreflight`，已授权用户也会被再弹一次），改为首次截图时由 `ensure_ready` 按需请求；启动阶段只做静默查询。`check_permissions` 的屏幕录制改双信号口径，与截图侧一致，修正「升级后失效」被误判成「从未授权」的文案错误。

            权限横幅点 × 后不再反复复活：dismiss 标记落盘到 localStorage，focus 回调从「accessibility 为真就清标记」改为边沿触发（false → true 才算恢复）。

            #### 🔧 修复六：浮窗材质层只增不减

            `window-vibrancy 0.8.1` 的 `apply` **不去重**（每次都新建 `NSVisualEffectView` 并 `addSubview`），而 `clear` 走 `viewWithTag:` **一次只摘一层**。于是 apply N 次 = N 层叠加，关掉玻璃开关后剩余的层永久留在窗口里 —— 表现就是「浮窗上有一块擦不掉的灰板」。改为 apply 前循环清到干净，`!glass` 分支同样循环清，循环以 `Ok(false)` 收尾（有界）。

            #### 📌 已知局限（请务必先读）

            - **Windows 上仍然没有背景模糊**，只有高透光 + 描边 + 内高光。系统 Acrylic 对无边框透明窗实测透光率仅 0.001，开了反而把原本能透 85% 的 CSS 透明盖死，属负优化。
            - **Windows 浅色壁纸下浮窗对比度仍不达标**（0.48 压暗 + 白字只有 3.40:1）。这是 v1.2.3 已书面承认的边界，属"按壁纸亮度自适应压暗"的范畴（需 Rust 侧抓屏采样）。本版**没有**把反色推到 Windows，因为深壁纸上的损失（净亏 10.5）远大于浅壁纸的收益。
            - **本版 macOS 侧改动未经真机目视复验**。浅色档的实际材质亮度、模板图在菜单栏的观感、权限中心文案在紧凑弹窗里是否被截断，都需要在 Mac 上确认。若有不符请发截图到 issue。

            #### ✅ 验证

            - `cargo check` 零警告 / `cargo test --lib` **35 passed / 0 failed**（本版新增 11 个单测：semver 比较 7 项 + 版本 tag 校验 + atom 解析 2 项 + 缺段容忍 1 项）/ `vue-tsc --noEmit` 零错误。
