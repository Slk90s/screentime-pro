            - **deb / rpm 包不参与自动升级**。用包管理器升级即可，应用会正确识别并只给下载链接。
            - **Windows 升级时进程会突然消失**，这是 NSIS 安装器接管的正常表现，不是崩溃。
            - **本版 macOS 侧改动未经真机目视复验**（权限中心文案在紧凑弹窗里是否被截断、重置按钮的点击反馈）。若有不符请发截图到 issue。

            #### ✅ 验证

            - `cargo check` 零警告 / `cargo test --lib` **35 passed / 0 failed / 4 ignored** / `vue-tsc --noEmit` 零错误。
            - **Linux 分支代码在 Windows 上被 `cfg` 编译掉**，等于从未验证。已用「自动抽取真实源码 + 探针 crate」单独编译，并做**反证**（把 `BundleType::AppImage` 注入为 `AppImageXXX`，确认报 E0599 而不是静默通过）。
            - **`latest.json` 用真实 updater 反序列化器实测**：`version` / `pub_date` / `platforms` 全部被接受；并做三个反证 —— 非 RFC3339 的 `pub_date` 被拒（`invalid value for pub_date`）、缺平台条目被拒、`v` 前缀被正确 trim。
            - **CI 的 `includeUpdaterJson` 已关**：三个平台并行构建会各写一份 `latest.json` 互相覆盖，最终只剩最后完成的那台。改为末尾单独作业汇总生成唯一一份。同时实测修正了一个会静默失效的坑 —— 该 input 真名是 `includeUpdaterJson`，不是 `uploadUpdaterJson`（写错时 Actions 只给 warning，行为不变）。

            > 完整版本历史见仓库 README。
          releaseDraft: false
          prerelease: false
          release: false
      - name: Inject Gatekeeper fix script into DMG
        # 当前构建无 Apple 签名/公证，用户打开会触发「已损坏」门禁提示。
        # 在 dmg 内注入一个 修复门禁.command：用户把 .app 拖入「应用程序」后，
        # 右键 → 打开 该脚本即可移除隔离属性（xattr -dr com.apple.quarantine），无需付费证书。
        # 脚本内联生成，不污染仓库。
        run: |
          set -e
          DMG=$(find src-tauri/target/aarch64-apple-darwin/release/bundle/dmg -name '*.dmg' | head -n1)
          echo "Found DMG: $DMG"
          hdiutil attach "$DMG" -mountpoint /tmp/stp_dmg -nobrowse -quiet
          rm -rf /tmp/stp_stage && mkdir -p /tmp/stp_stage
          cp -R /tmp/stp_dmg/. /tmp/stp_stage/
          cat > /tmp/stp_stage/修复门禁.command <<'SCRIPT'
          #!/bin/bash
          # 先移除脚本自身的隔离属性（若本脚本本身也被 Gatekeeper 拦截）
          xattr -d com.apple.quarantine "$0" 2>/dev/null || true
          APP="/Applications/ScreenTime Pro.app"
          if [ -d "$APP" ]; then
            xattr -dr com.apple.quarantine "$APP"
            osascript -e 'display dialog "已移除 ScreenTime Pro 的隔离属性，现在可以直接打开。" buttons {"好"} default button "好"' >/dev/null 2>&1
          else
            osascript -e 'display dialog "未找到 ScreenTime Pro.app。请先把应用拖入「应用程序」文件夹，再运行本脚本。" buttons {"好"} default button "好"' >/dev/null 2>&1
          fi
          SCRIPT
          chmod +x /tmp/stp_stage/修复门禁.command
          # 同时注入一份中文说明，讲清为什么被拦截、如何使用脚本或手动命令
          cat > /tmp/stp_stage/首次打开必读.txt <<'README'
          ============================================================
          ScreenTime Pro — 首次打开「已损坏 / 无法验证开发者」怎么办？
          ============================================================

          【为什么会有这个提示？】
          本应用目前没有购买 Apple 开发者证书做「公证(Notarization)」，
          因此 macOS 的 Gatekeeper 会把从网络下载的应用标记为隔离(quarantine)，
          首次打开时会提示「已损坏，无法打开」或「无法验证开发者」。
          这不是 App 本身有问题，只是系统的安全策略。

          【解决办法一（最省事，推荐）】
          1. 先把「ScreenTime Pro.app」拖进「应用程序」文件夹。
          2. 在 DMG 里【右键】「修复门禁.command」→ 选「打开」。
             ⚠️ 必须右键→打开才会看到「打开」按钮；直接双击会被系统拦截。
          3. 脚本会自动执行 xattr -dr com.apple.quarantine，弹窗提示成功后即可正常打开 App。

          【解决办法二（手动命令）】
          打开「终端」，粘贴并执行（-r 递归，确保 App 内部文件也一并清除隔离属性）：
            xattr -dr com.apple.quarantine "/Applications/ScreenTime Pro.app"
          若提示「No such xattr」，说明已无隔离属性，直接打开即可。

          处理一次之后，今后打开 App 都不再被拦截。
          README
          hdiutil detach /tmp/stp_dmg -quiet
          hdiutil create -volname "ScreenTime Pro" -srcfolder /tmp/stp_stage -ov -format UDZO "$DMG"
          echo "Injected 修复门禁.command + 首次打开必读.txt into DMG"
      - name: Upload injected DMG to Release (overwrite stale one)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          TAG="${{ github.ref_name }}"
          DMG=$(find src-tauri/target/aarch64-apple-darwin/release/bundle/dmg -name '*.dmg' | head -n1)
          echo "Injected DMG: $DMG"
          # Release 由 Windows/Linux job 创建；若尚未就绪，最多等待 ~5 分钟
          for i in $(seq 1 30); do
            if gh release view "$TAG" >/dev/null 2>&1; then break; fi
            echo "Release $TAG 尚未就绪，等待 10s ($i/30)..."
            sleep 10
          done
          gh release upload "$TAG" "$DMG" --clobber
          echo "Re-uploaded injected DMG to Release $TAG"
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-build
          path: |
            src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg

  # ---------- 汇总生成 latest.json（v1.2.11 新增）----------
  #
  # 为什么必须单独一个作业：
  #   tauri-action 的 `includeUpdaterJson`（默认 true）会用**本 runner 产出的那一个
  #   平台**写一份 latest.json 传到 Release。本项目三台 runner 并行跑同一个 tag，
  #   三份 latest.json 互相覆盖，最终线上只剩最后完成的那一个平台的条目 ——
  #   另外两个平台 check() 会拿到 Err(TargetsNotFound)（updater.rs:637），
  #   界面上表现为「检查更新失败」而不是「已是最新」。
  #   所以三个构建作业都设 includeUpdaterJson: false，由本作业收齐后上传唯一一份。
  #
  # ⚠️ 平台键必须与 updater 的查找顺序严格一致（updater.rs:618-626）：
  #   先找 `{os}-{arch}-{installer}`，再退 `{os}-{arch}`；arch 用 updater 自己的
  #   命名（x86_64 / aarch64 / i686 / armv7），**不是** Node 的 x64 / arm64；
  #   installer 是 `Installer::name()` 的小写值（appimage / deb / rpm / msi / nsis）。
  #   - Windows nsis   → windows-x86_64-nsis
  #   - Linux AppImage → linux-x86_64-appimage
  #   - macOS 故意不写：见 src-tauri/src/app_update.rs 模块头「为什么 macOS 必须关闭」
  #
  # ⚠️ `signature` 必须是 .sig 文件的**内容**，不是路径、不是 URL。
  #   写成路径的话客户端会验签失败，且报错发生在下载完之后，用户已经白等一次。
  updater-json:
    needs: [windows, linux]
    runs-on: ubuntu-24.04
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-artifacts

      - name: Generate latest.json
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          echo "--- 收到的产物 ---"
          find dist-artifacts -type f | sort
          # ⚠️ PUB_DATE 必须是严格 RFC3339（Z 结尾）：updater 用
          # `OffsetDateTime::parse(..., Rfc3339)` 反序列化，格式不对会让客户端
          # 检查更新直接失败（updater.rs:1479-1484 把解析错误转成 DeError）。
          # 这里用构建时刻，而不是 github.event.repository.updated_at ——
          # 后者在评论区变动时也会更新，与「发布时刻」无关。
          export PUB_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "pub_date=$PUB_DATE"
          python3 .github/scripts/gen_latest_json.py dist-artifacts latest.json

      - name: Upload latest.json to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          TAG="${{ github.ref_name }}"
          # Release 由构建作业创建；并行时可能尚未就绪，最多等 ~5 分钟。
          for i in $(seq 1 30); do
            if gh release view "$TAG" >/dev/null 2>&1; then break; fi
            echo "Release $TAG 尚未就绪，等待 10s ($i/30)..."
            sleep 10
          done
          gh release view "$TAG" >/dev/null 2>&1 || {
            echo "::error::Release $TAG 在等待 5 分钟后仍不存在"; exit 1; }
          gh release upload "$TAG" latest.json --clobber
          echo "已上传 latest.json（tag=$TAG）"
