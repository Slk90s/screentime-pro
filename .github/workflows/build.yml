name: Build ScreenTime Pro (all platforms)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ---------- Windows ----------
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install frontend deps
        run: npm ci --no-audit --no-fund
      - name: Build Tauri (Windows)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --ci --target x86_64-pc-windows-msvc --bundles nsis
          tagName: "v__VERSION__"
          releaseName: "v__VERSION__"
          releaseBody: |
            ### 屏幕时间管家 ScreenTime Pro — v0.9.0
            #### ✨ 新增：取字增强引擎（本地 PaddleOCR v4 / ONNX）
            - 本地**两段式**识别（文本检测 → 文本识别），小字号与深色底识别率从「经常丢字」提升到**全对**（固定测试图 8/8 行，含 11px 极小字与深色主题）
            - det 会把短边不足 736px 的图**先整体放大再检测**，这是系统内置识别做不到的
            - 设置页新增「取字引擎」标准 / 增强双选：默认仍为系统内置（零额外体积）；资源缺失时该选项自动置灰并说明原因；遮罩窗取字面板显示本次**实际生效**的引擎与识别行数（失败只留原因，不误导）
            - ⚡ 性能：模型加载只付一次（会话常驻缓存）+ 图优化 + 打开截图遮罩即后台预热，第一次取字不再卡住，之后即时响应
            #### ✨ 新增：macOS 系统 Vision 取字（「标准」引擎在 mac 上落地）
            - macOS 的「标准」引擎现在**真的存在**：直接调用系统 Vision（`VNRecognizeTextRequest`，Accurate 级 + 语言校正 + 自动语种判别）—— **零下载、零模型体积、断网可用**，装机即可取字
            - 设置页「标准」选项按平台显示对应实现：Windows「系统内置（WinRT）」/ macOS「系统 Vision」
            #### 🔧 修复
            - **桌宠拖拽不够跟手**：拖拽期窗口保持 100% 静态（暂停皮肤 idle 动画、气泡计时与过热角标动画），与悬浮窗同机制，消除拖拽抖动
            - **桌宠隐藏语义不统一**：右键菜单「隐藏桌宠」与设置页「隐藏桌宠」现在行为完全一致（都会关闭桌宠开关并跨窗口同步）
            - **macOS / Linux 取字此前完全不可用（P0）**：修复运行库**永远落不了盘**（下载落盘路径返回的是目录而非「目录/文件名」）、下载超时过短（20s → 连接 30s + 总上限 10 分钟 + 每源 3 次重试，并新增 Gitee 镜像作第二源）、以及 macOS / Linux 默认引擎与存量配置不自愈三个问题
            - **macOS「取字引擎」两个选项都点不了**：可选中判据改为只看**随包模型**是否齐备（运行库缺失不再是禁用理由，它由后台下载补齐），消除「选项置灰 → 下载永不触发 → 永久锁死」的死锁
            #### 📦 三端资源分发策略（重要）
            - **Windows**：onnxruntime 运行库 **+** det/rec 模型**全部随包** —— 零下载、断网可用
            - **macOS / Linux**：det/rec 模型**随包**；平台运行库（`libonnxruntime.dylib` / `libonnxruntime.so`）改为**首次使用增强引擎时后台静默下载**（约 40MB / 29MB，带 SHA256 校验），落到用户缓存目录后复用
            - 下载失败**绝不阻断取字**：自动回落「标准」引擎并给出提示，不会让截图流程崩溃
            - 🎯 **零上传红线不变**：任何平台都不上传用户数据、不传图；mac / Linux 仅下载自身运行库这一次性文件
            #### 📊 包体积
            | 平台 | 产物 | 体积 |
            |---|---|---|
            | Windows | `-setup.exe`（NSIS 安装器） | ~27 MB |
            | macOS（Apple Silicon） | `.dmg` | ~27 MB |
            | Linux | `.deb` / `.rpm` | ~27 MB |
            | Linux | `.AppImage` | ~107 MB |
            > 完整版本历史见仓库 README。
          releaseDraft: false
          prerelease: false
          release: true
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: |
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe

  # ---------- Linux ----------
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential \
            curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev \
            librsvg2-dev libx11-dev pkg-config \
            libpipewire-0.3-dev libgbm-dev libegl1-mesa-dev
