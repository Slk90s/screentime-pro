            - 设置页「标准」选项按平台显示对应实现：Windows「系统内置（WinRT）」/ macOS「系统 Vision」
            #### 🔧 修复
            - **桌宠拖拽不够跟手**：拖拽期窗口保持 100% 静态（暂停皮肤 idle 动画、气泡计时与过热角标动画），与悬浮窗同机制，消除拖拽抖动
