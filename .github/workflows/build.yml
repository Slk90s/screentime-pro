            - **macOS / Linux 取字此前完全不可用（P0）**：修复运行库**永远落不了盘**（下载落盘路径返回的是目录而非「目录/文件名」）、下载超时过短（20s → 连接 30s + 总上限 10 分钟 + 每源 3 次重试，并新增 Gitee 镜像作第二源）、以及 macOS / Linux 默认引擎与存量配置不自愈三个问题
            - **macOS「取字引擎」两个选项都点不了**：可选中判据改为只看**随包模型**是否齐备（运行库缺失不再是禁用理由，它由后台下载补齐），消除「选项置灰 → 下载永不触发 → 永久锁死」的死锁
