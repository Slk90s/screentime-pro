name: Build ScreenTime Pro (all platforms)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ---------- Windows ----------
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install frontend deps
        run: npm ci --no-audit --no-fund
      - name: Build Tauri (Windows)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --ci --target x86_64-pc-windows-msvc --bundles nsis
          tagName: "v__VERSION__"
          releaseName: "v__VERSION__"
          releaseBody: |
            ### 屏幕时间管家 ScreenTime Pro — v0.9.5
            #### 🟣 macOS 截图体验重做（本版重点）
            - **全新紧凑授权弹窗**：失败提示从一大段诊断文字精简为一句话原因 + 两个按钮（「去授权」/「重置权限并重启」），详细诊断折叠进「详情」区，完整证据转日志
            - **授权状态实时翻转**：弹窗每 2 秒轮询一次，在系统设置里勾选授权后，弹窗自动变为「✅ 已授权，点此重启」，无需手动刷新
            - **启动即预请求授权**：应用启动 3 秒后自动向系统登记屏幕录制权限，首次使用前系统设置列表里就能看到本应用，不用等第一次截图失败
            - **macOS 14+ 升级 ScreenCaptureKit 引擎**：替代已废弃的 CGWindowListCreateImage 旧接口，截图更准更快；旧系统自动回落原引擎，行为不变
            - 修复「系统里已授权，应用仍提示无法截图」的双信号判定保持不变（官方预检 或 窗口标题探针可读即放行）
            - 新增 4 个权限相关 IPC（总数 84→88）：`screenshot_permission_status` / `screenshot_request_permission` / `screenshot_open_permission_settings` / `screenshot_restart_app`
            - Info.plist 补充 `NSScreenCaptureUsageDescription`（触发屏幕录制授权弹窗的必需键，缺失会被系统直接终止应用）
            #### 📊 包体积
            | 平台 | 产物 | 体积 |
            |---|---|---|
            | Windows | `-setup.exe`（NSIS 安装器） | ~27 MB |
            | macOS（Apple Silicon） | `.dmg` | ~27 MB |
            | Linux | `.deb` / `.rpm` | ~27 MB |
            | Linux | `.AppImage` | ~107 MB |
            > 完整版本历史见仓库 README。
          releaseDraft: false
          prerelease: false
          release: true
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: |
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe

  # ---------- Linux ----------
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential \
            curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev \
            librsvg2-dev libx11-dev pkg-config \
            libpipewire-0.3-dev libgbm-dev libegl1-mesa-dev
      - name: Install frontend deps
        run: npm ci --no-audit --no-fund
      - name: Build Tauri (Linux)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --ci --target x86_64-unknown-linux-gnu
          tagName: "v__VERSION__"
          releaseName: "v__VERSION__"
          releaseBody: |
            ### 屏幕时间管家 ScreenTime Pro — v0.9.5
            #### 🟣 macOS 截图体验重做（本版重点）
            - **全新紧凑授权弹窗**：失败提示从一大段诊断文字精简为一句话原因 + 两个按钮（「去授权」/「重置权限并重启」），详细诊断折叠进「详情」区，完整证据转日志
