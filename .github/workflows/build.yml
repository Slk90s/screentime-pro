name: Build ScreenTime Pro (all platforms)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ---------- Windows ----------
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install frontend deps
        run: npm ci --no-audit --no-fund
      - name: Build Tauri (Windows)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # v1.2.11：updater 强制要求 ed25519 签名，没有这个 key 构建会直接失败。
          # 用 --ci 生成的无密码私钥，所以不需要 _PASSWORD 变量。
          # 🔴 私钥丢失 = 已安装用户永久无法再收到更新（客户端只认硬编码公钥）。
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          args: --ci --target x86_64-pc-windows-msvc --bundles nsis
          # v1.2.11：**关掉** tauri-action 自带的 latest.json 上传。
          # 三个平台是三个独立 runner，各自只会写出「自己那一个平台」的条目，
          # 后跑的会覆盖先跑的 → 最终线上 latest.json 只剩最后一个平台，
          # 另两个平台 check() 直接 Err(TargetsNotFound)。
          # 正确做法是末尾的 updater-json 作业汇总所有平台后再上传一次（见文件末尾）。
          includeUpdaterJson: false
          tagName: "v__VERSION__"
          releaseName: "v__VERSION__"
          releaseBody: |
            ### 屏幕时间管家 ScreenTime Pro — v1.2.11

            > 本版主题是 **应用内自动升级**（Windows / Linux AppImage 可一键升级），外加 **macOS 权限中心的三个真实缺陷修复**。macOS 不参与自动升级，原因见下方「已知局限」。

            #### ✨ 新增：应用内自动升级（Windows / Linux AppImage）

            以前「发现新版本」只能跳浏览器手动下载。本版接入 Tauri 官方 updater：检查 → 下载 → **ed25519 验签** → 交给平台安装器，全程在应用内完成。

            - **Windows**：拉起 NSIS 安装包后**进程会立即退出**（upstream 在 `ShellExecuteW` 之后直接 `process::exit(0)`），安装器接管，装完自动重启。这不是崩溃。
            - **Linux（仅 AppImage）**：原地覆盖自身并自动重启。**deb / rpm 包不参与** —— 那两种走 `pkexec dpkg -i` / `rpm -U`，每次升级都要过一次系统授权框，本就应该由包管理器接手（`apt upgrade` / `dnf upgrade`）。应用会识别自己的包型，deb/rpm 用户点「检查更新」仍只会看到「前往下载」。
            - **签名不可关闭**：客户端硬编码公钥，只认用对应私钥签过的包。这条是安全底线，也是**私钥丢失 = 已安装用户永久收不到更新**的原因。

            #### 🐞 修复一：辅助功能已授权，应用却仍报「未授权」（P0）

            **症状**：系统设置 → 隐私与安全性 → 辅助功能里，本应用的开关**明明是开着的**，应用自己的设置页仍显示「辅助功能 ❌未授权」。

            **根因**（三层叠加，缺一不可）：
            1. **TCC 授权是按进程快照的**。用户把开关打开时应用正在运行，那个进程拿不到新授权 —— 必须重启进程才生效，但界面上没有任何引导。
            2. **ad-hoc 签名让授权记录指向「上一份二进制」**。CI 没有 `APPLE_SIGNING_IDENTITY`，每次构建的 cdhash 都不同；TCC 记录按「路径 + cdhash」绑定，于是升级后旧记录失效，而系统设置界面显示的仍是开关状态。
            3. **设置页的提示条件写反了**，且「重置」按钮只清屏幕录制、不清辅助功能 —— 文案说「重置并重启」，实际清的是另一个服务，用户白忙。

            **修法**：提示条件改正；重置按钮按服务分流（`tccutil reset Accessibility` / `ScreenCapture`）；辅助功能行也补上独立的重置入口；提示文案改为专门的辅助功能说明（不再与屏幕录制共用一条）。

            顺带确认：**辅助功能对本应用并非功能必需**。空闲检测用的是 `CGEventSourceSecondsSinceLastEventType`，不需要该权限；它只用于设置页的状态显示。所以即使不授权，计时本身是准的。

            #### 🐞 修复二：macOS 版仍无法自动升级（已知边界，非缺陷）

            macOS 侧**主动关闭**了应用内升级，两个独立理由：

            1. **ad-hoc 签名会让授权每次升级都失效**。见修复一 —— 自动升级等于让「权限掉了」每升级一次复发一次，比不自动升级更糟。
            2. **缺平台条目会硬报错**。若 `latest.json` 里没有 macOS 条目，updater 返回的是 `Err(TargetsNotFound)` 而非「无更新」，会让 macOS 用户每次启动都在日志里刷一条错误。

            macOS 用户请继续从发布页下载 DMG。后续若拿到 Apple Developer 签名证书，会重新评估。

            #### 📌 已知局限（请务必先读）

            - **macOS 不参与自动升级**（原因见上）。仍会照常提示「发现新版本」并给出下载页链接。
            - **deb / rpm 包不参与自动升级**。用包管理器升级即可，应用会正确识别并只给下载链接。
            - **Windows 升级时进程会突然消失**，这是 NSIS 安装器接管的正常表现，不是崩溃。
            - **本版 macOS 侧改动未经真机目视复验**（权限中心文案在紧凑弹窗里是否被截断、重置按钮的点击反馈）。若有不符请发截图到 issue。

            #### ✅ 验证

            - `cargo check` 零警告 / `cargo test --lib` **35 passed / 0 failed / 4 ignored** / `vue-tsc --noEmit` 零错误。
            - **Linux 分支代码在 Windows 上被 `cfg` 编译掉**，等于从未验证。已用「自动抽取真实源码 + 探针 crate」单独编译，并做**反证**（把 `BundleType::AppImage` 注入为 `AppImageXXX`，确认报 E0599 而不是静默通过）。
            - **`latest.json` 用真实 updater 反序列化器实测**：`version` / `pub_date` / `platforms` 全部被接受；并做三个反证 —— 非 RFC3339 的 `pub_date` 被拒（`invalid value for pub_date`）、缺平台条目被拒、`v` 前缀被正确 trim。
            - **CI 的 `includeUpdaterJson` 已关**：三个平台并行构建会各写一份 `latest.json` 互相覆盖，最终只剩最后完成的那台。改为末尾单独作业汇总生成唯一一份。同时实测修正了一个会静默失效的坑 —— 该 input 真名是 `includeUpdaterJson`，不是 `uploadUpdaterJson`（写错时 Actions 只给 warning，行为不变）。

            > 完整版本历史见仓库 README。
          releaseDraft: false
          prerelease: false
          release: true
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: |
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe.sig

  # ---------- Linux ----------
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential \
            curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev \
            librsvg2-dev libx11-dev pkg-config \
            libpipewire-0.3-dev libgbm-dev libegl1-mesa-dev
      - name: Install frontend deps
        run: npm ci --no-audit --no-fund
      - name: Build Tauri (Linux)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          # v1.2.11：Linux 会产出 .deb / .rpm / .AppImage / .AppImage.tar.gz 及其 .sig。
          # 但客户端**只会用 AppImage** 那份（deb/rpm 在 install_supported() 里被拒），
          # 所以 latest.json 里必须放 AppImage.tar.gz —— updater 的
          # `install_appimage` 认 tar.gz（解包取 .AppImage）也认裸 AppImage。
          args: --ci --target x86_64-unknown-linux-gnu
          includeUpdaterJson: false
          tagName: "v__VERSION__"
          releaseName: "v__VERSION__"
