name: Build ScreenTime Pro (all platforms)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ---------- Windows ----------
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install frontend deps
        run: npm ci --no-audit --no-fund
      - name: Build Tauri (Windows)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --ci --target x86_64-pc-windows-msvc --bundles nsis
          tagName: "v__VERSION__"
          releaseName: "v__VERSION__"
          releaseBody: |
            ### 屏幕时间管家 ScreenTime Pro — v1.2.5
            #### 🚀 体积与性能优化（本版重点）
            - **安装包与前端资源大幅瘦身**：桌宠皮肤帧图由 PNG 换为 WebP（q80 + alpha 无损）。实测 **16 张图 5.30 MB → 0.64 MB（省 88.0%）**，前端构建产物 `dist` **5.08 MB → 1.17 MB（省 77%）**，其中图片体积占比从 87.0% 降到 43.6%。透明通道经逐像素比对**零损失**（alpha MAE 0.000），半透明边缘 RGB 平均差 2.73/255（约 1%），肉眼不可辨；蜘蛛侠皮肤为二值 alpha，alpha 与边缘 RGB 均无误差
            - **Rust release 构建启用官方推荐优化**：新增 `[profile.release]` —— `codegen-units=1` + `lto=true` + `opt-level="s"` + `panic="abort"` + `strip=true`（依据 Tauri v2 官方 App Size 指南）。此前项目完全没有该配置，全部走 Rust 默认值（`opt-level=3` / `lto=false` / `codegen-units=16` / `panic=unwind`）
            - **移除每次落库的冗余聚合写入**：`daily_summaries` 是一张 `(date, app_id)` 预聚合表，每次记录都要多跑一条 UPSERT 维护它 —— 但经全仓核查，**没有任何 SELECT 从它读**（同名的 `get_daily_summaries()` 实际是从 `sessions` 现场 `GROUP BY`）。现已停写该表，每笔使用记录少一次写放大与 B-tree 维护；表结构与清理逻辑保留，老库数据不受影响、**统计口径完全不变**
            - **清理死代码与死资源**：移除全仓无人引用的 `PetCanvas.vue` / `PetPreviewStage.vue` / `PetLayer.vue` / `spriteLayout.ts`，及其独占的 23 张 sprite 素材（3.4 MB）与 7 张废弃的熊猫切图（2.2 MB）。这些文件**从未进入过构建产物**（Vite tree-shake 已排除），故不影响任何运行时行为，只减负源码与仓库
            #### 🐞 修复
            - **修复桌宠皮肤选择被静默改回默认**：选择蜘蛛侠皮肤后，刷新或重启应用会悄悄变回熊猫。根因是皮肤注册表在**逐个注册的过程中**就校验「当前皮肤是否存在」，而注册第一张皮肤时后面那些还没进表，于是用户的选择被误判为失效并回落成默认值。现已改为「先全部注册、再统一校验」，并修正了失效皮肤的回落目标（必须是确实已注册的皮肤，而非硬编码 id）。真机验证：切到蜘蛛侠 → 刷新 → 保持蜘蛛侠（DOM 与 localStorage 双确认），反向切回熊猫同样生效
            - **补齐 `*.webp` 的 TypeScript 模块声明**：`vue-tsc --noEmit`（`npm run build` 的第一步）不认 `.webp`，换图后会报 `TS2307 找不到模块`，而 `vite build` 单独跑却能通过 —— 两套解析器行为不一致，属易漏的构建陷阱，已在 `src/env.d.ts` 补上声明
            - **更正 `App.vue` 的过时架构注释**：旧注释称「路由用动态组件 + keep-alive 按侧边栏切换 Dashboard / Trends / Rules / Settings」，与实现不符 —— 实际无路由库、无 keep-alive，四个 tab 在 `Dashboard.vue` 内部用 `v-if` 切换
            #### 📊 包体积
            | 项目 | 优化前 | 优化后 |
            |---|---|---|
            | 前端 `dist` | 5.08 MB | 1.17 MB（−77%） |
            | 桌宠图片（16 张） | 5.30 MB | 0.64 MB（−88%） |
            > 完整版本历史见仓库 README。
          releaseDraft: false
          prerelease: false
          release: true
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: |
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe

  # ---------- Linux ----------
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential \
            curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev \
            librsvg2-dev libx11-dev pkg-config \
            libpipewire-0.3-dev libgbm-dev libegl1-mesa-dev
      - name: Install frontend deps
        run: npm ci --no-audit --no-fund
      - name: Build Tauri (Linux)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --ci --target x86_64-unknown-linux-gnu
          tagName: "v__VERSION__"
          releaseName: "v__VERSION__"
          releaseBody: |
