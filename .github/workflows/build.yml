name: Build ScreenTime Pro (all platforms)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ---------- Windows ----------
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install frontend deps
        run: npm ci --no-audit --no-fund
      - name: Build Tauri (Windows)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --ci --target x86_64-pc-windows-msvc --bundles nsis
          tagName: "v__VERSION__"
          releaseName: "v__VERSION__"
          releaseBody: |
            ### 屏幕时间管家 ScreenTime Pro — v1.2.8

            > 本版为 **macOS 悬浮窗玻璃专项修复**。Windows / Linux 无功能改动，可不升级。

            #### 🐞 修复（本版重点：macOS 15 悬浮窗玻璃右端外溢 3px + 双弧）

            - **症状**：macOS 15 上悬浮指标条（液态玻璃模式）右端多出约 3px 的灰边，右侧圆角看起来是「两道弧叠在一起」，左侧却干净。截图放大到像素级能明显看到。
            - **根因（四环链，均有像素证据，非推测）**：
              1. 前端 `fitWidth()` 把窗口宽度设为「内容宽度 + 2」（2 是左右各 1px 边框的补偿）。窗口是 `border-box`，所以内容区比窗口窄 2px。
              2. 旧结构只有**一层** DOM 同时承担「窗口尺寸」和「胶囊绘制」，且它是块级元素 → 那多出来的 2px **全部落在右端**，左侧 0px。
              3. 系统材质视图（`NSVisualEffectView`）铺满**整个 NSWindow 边界**，不认 CSS 的 `border-radius`，也没有任何东西在窗口内部把它裁进胶囊里。
              4. 它自己还有一个 `cornerRadius(22)` 的私有圆角，画在 **403px 宽**的矩形上，而 CSS 圆角画在 401px 宽的胶囊上 → 两个弧不同心，右侧就出现「双弧 + 外溢」。
            - **决定性证据**：右端那条 3px 带的亮度恒为 L≈123，而紧邻的壁纸亮度在同一区域从 L=2 摆到 L=43。CSS 元素的颜色会跟随背景变化，恒定的亮度说明它是**材质视图自己的边缘**，与 CSS 无关。
            - **修法（三层）**：
              1. **结构两层化**：外层只负责「等于窗口尺寸」，内层用 `width:max-content` 承载真实内容，外层 `justify-content:center` → 那 2px 变成左右各 1px 的**对称**余量，不再全堆在右边。
              2. **材质换档**：`NSVisualEffectMaterial` 由 `HudWindow`(13) 换成 `UnderWindowBackground`(21)。`HudWindow` 是为 HUD 面板设计的高遮蔽材质 —— 实测胶囊内部亮度与正上方壁纸亮度的**相关系数仅 r≈0.02**，桌面内容形状完全不可见，视觉上就是一块灰板。`UnderWindowBackground` 是「窗口背景之下那一层」，透光率显著更高。
              3. **配色分档**：后端新增 `native_blur` 字段如实上报「本次是否真的应用了系统背景模糊」（这是事实，不是能力）。前端据此在「轻压暗让模糊透出」与「重压暗保住文字对比度」两档配色间切换。**Windows 必须走重压暗**——它在 Windows 上刻意不调任何系统材质（见下），若误判成「有模糊」就会用轻压暗，白字直接溶进桌面。

            #### 🔍 关于「能不能做出真正的液态玻璃」

            **macOS 26 以下做不到折射。** 折射需要系统在合成器层面采样窗口背后的像素，公开 API 在 macOS 11~15 上不提供这个能力，CSS 也伪造不了（`backdrop-filter` 的取样源是同一文档内的 DOM 背景，采不到操作系统桌面 —— 本项目又把 html/body/#app 全设成了透明，那条 blur 实际是空转）。

            macOS 26+ 走的是 `NSGlassEffectView`，有真实折射。本版在 15 上的目标是**把它做成一块像样的磨砂玻璃**（背景内容能透出来、文字清楚），而不是假装有折射。

            #### 📌 已知局限（请务必先读）

            - **Windows 上仍然没有背景模糊**，只有高透光 + 描边 + 内高光。原因：真机像素实测发现系统 Acrylic 对无边框透明窗会渲染成**不透明色块**（背景亮度 255 与 70 时浮窗恒为 212，透光率 0.001），开了反而把原本能透 85% 的 CSS 透明盖死，属负优化。
            - **本版在 macOS 15 上的最终观感未经真机复验**。修复依据是 macOS 15 的截图逐像素测量 + 与 `window-vibrancy` 0.8.1 源码逐行比对，Windows 侧无法模拟 macOS 合成器行为。若你装上后仍觉得哪里不对，请把截图发到 issue，我按新证据继续调。

            #### ✅ 验证

            - 几何回归脚本：**24 项断言全通过**（`TOL = 0.05`）。实测内容固有宽度 407.64 → 窗口 410 → 胶囊 410.00，左右余量 1.17 / 1.19 对称。
            - 反证：按旧语义（单层 + 右端堆积）重跑，得到窗口 412 / 胶囊 409.64 = **右端暴露 2.36px** @ 容差 0.05 → 必然 FAIL。说明脚本确实能捕获这个 bug，不是空跑。
            - 最窄内容场景独立脚本：**10 项断言全通过**。含 `FLOAT_MIN_WIDTH` 夹取路径（实测最窄纯图标态 127.64 → 请求 130 → 夹到 140），夹取后胶囊仍严格等于窗口、左右余量 5.17 / 5.19。
            - macOS 专属代码（本版改的就是它）在 Windows 上会被 `cfg` 编译掉，已用 `cargo check --target aarch64-apple-darwin` 交叉探针实测通过，并做了两次反证（把材质名改成不存在的变体 → E0599；把 radius 从 `f64` 改成 `&str` → E0308），确认探针真的在编译这段代码。

            > 完整版本历史见仓库 README。
          releaseDraft: false
          prerelease: false
          release: true
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: |
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe

  # ---------- Linux ----------
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential \
            curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev \
            librsvg2-dev libx11-dev pkg-config \
            libpipewire-0.3-dev libgbm-dev libegl1-mesa-dev
      - name: Install frontend deps
        run: npm ci --no-audit --no-fund
      - name: Build Tauri (Linux)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --ci --target x86_64-unknown-linux-gnu
          tagName: "v__VERSION__"
          releaseName: "v__VERSION__"
