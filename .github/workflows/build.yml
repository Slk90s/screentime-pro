name: Build ScreenTime Pro (all platforms)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ---------- Windows ----------
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install frontend deps
        run: npm ci --no-audit --no-fund
      - name: Build Tauri (Windows)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --ci --target x86_64-pc-windows-msvc --bundles nsis
          tagName: "v__VERSION__"
          releaseName: "v__VERSION__"
          releaseBody: |
            ### 屏幕时间管家 ScreenTime Pro — v1.2.7
            > 自 v1.2.2 起累积发布。一次升级即可获得 v1.2.3 ~ v1.2.7 的全部修复与改进。

            #### 🐞 修复（本版重点：三个「静默失效」问题）
            - **修复「截过一次图之后就不再记录时长」**：截图遮罩窗（`ScreenTime Capture`）被配置成 `visible:false` 却 `focus:true`，隐藏窗在创建时**仍会成为前台窗口**且不再让出，`GetForegroundWindow()` 从此一直返回这个看不见的窗口，采样循环每 tick 都判定「这是本程序辅助窗口」并跳过 —— 整段时间一条记录都不落库。实测对照（同机同库）：前台为该隐藏窗时 **18 秒新增 0 条**，前台为真实应用时 **18 秒新增 1 条**。修复三处：① 该窗口 `focus` 改为 `false`；② 采集侧新增「前台窗口不可见即跳过」的通用兜底，不再依赖标题白名单；③ 截图收尾后若前台仍卡在遮罩窗上则主动让出焦点。验证：修复前 6 分钟跳过 **833 次**、采集 0 次；修复后 40 秒跳过 **0 次**、成功采集 **32 次**
            - **修复 OCR 文本行排序偶发崩溃**：文字识别按行聚合时，比较器用的是**成对计算**的阈值（`(a.h + b.h) / 2 × 0.6`），导致 A≈B、B≈C 却 A<C，违反 `sort_by` 要求的全序。Rust 检测到排序漂移会直接 panic（`user-provided comparison function does not correctly implement a total order`），日志中已捕获 2 次。现改为三段式排序：先按 y 中心排 → 用**全局常量**阈值（行高中位数 × 0.6，只算一次）归并行号 → 按 (行号, x) 排
            - **修复设置页「初始化竞态」丢更新与「反向数据损坏」（三处同源）**：进入设置页后若在加载返回前操作，晚到的 `ref.value = await load()` 会整体替换并冲掉用户改动；更严重的是**提交时发的是整个本地对象**（本地初值全是默认值），会把后端本是 `true` 的开关一并写成 `false` 并持久化。实测：只点「显示网速」，另外 4 个字段被静默关闭并写库。修法改为**「权威基线 + 用户差量」**模型——加载返回 `{ ...loaded, ...delta }`、提交 `{ ...baseline, ...delta }`，基线为空时提交前先同步拉一次后端真值。覆盖状态栏（2 个写入点 + 托盘推送事件）、截图配置（4 个写入点 + 2 个 v-model 数值项）、通用设置表单（设备名 / 空闲阈值 / 保留天数）、自动备份开关。实测：进页面 +10ms 输入设备名，修复前被回填成旧名且「保存」存回旧名字，修复后用户输入完整保留

            #### 🐞 其他修复
            - **液态玻璃浮窗在中浅色壁纸上看不清**：实测主数字仅 **2.69:1**、标签 **1.70:1**，远低于 WCAG AA 4.5:1。根因是玻璃底色为 `rgba(255,255,255,0.10)`「加白」，浅色壁纸上把胶囊推到接近白。改为「压暗 + 顶部白高光」（`rgba(0,0,0,0.48)`）并同步提亮文字与字号（12→13px），逐像素实测 **白 6.59:1 / 网速↓ 4.85 / ↑ 4.91 / 标签 5.08**，四项全部过 AA。普通模式未改动
            - **macOS 设置面板图标渲染成彩色噪点**：`icon.icns` 的 16px / 32px 被写成 `icp4`/`icp5` 老式段 + **PNG 载荷**，而这两个键规范要求 24-bit RGB，macOS 在 App Bundle 场景下会按 RGB 解析 PNG 流，把压缩字节当像素渲染。改用现代键 `ic04`/`ic05` + **ARGB 载荷**，与 Apple `iconutil` 产出做过**字节级等价验证**（569B↔569B、1514B↔1514B 逐字节一致）。v1.2.2 的 Dock 图标留白修复完整保留
            - **桌宠皮肤选择被静默改回默认**：`register()` 在**逐个注册的过程中**就校验 `activeId` 是否存在 —— 用户选了第二张皮肤（spiderman）时，注册第一张（popmart-3d）的瞬间它必然「不存在」，于是判定失效并回落+写盘。结果是**只要选的不是第一张注册的皮肤就必然丢失**。改为注册期只登记、全部注册完后由 `sealRegistration()` 统一校验一次（幂等 + 懒触发）

            #### 🔧 加固与优化
            - **安装包体积 −62.6%（23.31MB → 8.72MB）**：补齐 Tauri 官方推荐的 `[profile.release]`（`codegen-units=1` / `lto` / `opt-level="s"` / `panic="abort"` / `strip`）。前置校验：全仓 `catch_unwind` 0 处、PE 无 `.debug` 节、bundle 不打包 `.pdb`。另将桌宠图片 PNG→WebP，**5.30MB → 0.64MB（−88%）**，alpha 通道 MAE=0.000（零损失）
            - **写库失败不再静默丢弃**：会话落库原为 `let _ = insert_session(...)`，失败完全无声。现记录 error 日志，并在 DB 连接设 `busy_timeout=5s` 让瞬时锁冲突自动重试
            - **WAL 文件体积收敛**：数据库本体仅 385 KB 旁边却常驻 4.13 MB 的 `-wal`。根因是 `wal_autocheckpoint` 默认 1000 页形成的均衡态，此时只设 `journal_size_limit` 完全无效。改为 `wal_autocheckpoint=256` + `journal_size_limit=1MB`，实测稳态 **4,132,392 B → 1,048,576 B（−75%）**，每笔写入仅 +0.1 ms
            - **日志噪音治理**：采样间隔 2 秒，「锁屏 / 无前台窗口」等**正常状态**曾以每小时 1800 条刷日志（历史累计 9376 条，占全部 WARN 的 98%）。改为只在状态翻转时记一条
            - **缺图标不再导致启动崩溃**：`default_window_icon().unwrap()` 降级为警告 + 空图标兜底
            - **停写死表**：移除 `daily_summaries` 的 UPSERT（只写不读），保留表结构与清理逻辑

            #### ✨ 新增
            - **启动时自动检查更新 + 首页可关闭提示横条**：启动 15 秒后静默检查 GitHub 最新版本，发现新版本时在统计概览页顶部显示可关闭横条，点「查看更新」跳转 Release 页。**延迟 15s** 避开首屏 DB 迁移/采样/建窗；**24h 节流在后端强制**（GitHub 未认证 API 限流 60 次/小时/IP）；**失败完全静默**（断网/限流是常态，弹「检查失败」等于把基础设施问题伪装成软件故障）；**同版本只提示一次**，更高版本仍会提示。设置页原有的手动检查按钮保持不变（自动 = 告知，手动 = 问询）。本版**不做应用内自动升级**：Tauri updater 需一对签名密钥，且此后所有版本必须同密钥签名，密钥丢失 = 所有用户只能手动重装

            #### 📌 升级提示
            - 若你此前遇到「用过一段时间后统计突然不再增长」，本版已修复，升级后无需额外操作
            - **已有的历史记录不会回填**（缺失的那段时间当时就没有写入数据库），本版只保证**此后不再丢**
            - 升级后安装包体积会明显变小（约 8.7MB），这是预期的构建优化，不是组件缺失
            > 完整版本历史见仓库 README。
          releaseDraft: false
          prerelease: false
          release: true
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: |
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe

  # ---------- Linux ----------
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential \
            curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev \
            librsvg2-dev libx11-dev pkg-config \
            libpipewire-0.3-dev libgbm-dev libegl1-mesa-dev
      - name: Install frontend deps
        run: npm ci --no-audit --no-fund
      - name: Build Tauri (Linux)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --ci --target x86_64-unknown-linux-gnu
