name: Build ScreenTime Pro (all platforms)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ---------- Windows ----------
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install frontend deps
        run: npm ci --no-audit --no-fund
      - name: Build Tauri (Windows)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --ci --target x86_64-pc-windows-msvc --bundles nsis
          tagName: "v__VERSION__"
          releaseName: "v__VERSION__"
          releaseBody: |
            ### 屏幕时间管家 ScreenTime Pro — v0.7.7 更新（稳定性修复）
            - 🩹 macOS 闪退修复（重要）：状态栏 / 悬浮指标条开启后 macOS 启动即崩。根因是磁盘指标采样用 statfs(2) 时输出缓冲仅 256 字节，而 Darwin struct statfs 实为 2168 字节且该 API 无长度参数，内核写满即造成栈越界写。现改用真实布局的 repr(C) 结构体接收，并加 size_of 编译期断言防回归
            - 🩹 Windows 首次启动闪黑框修复：查询 WebView2 / MachineGuid 的 reg 子进程改为无窗口方式创建（CREATE_NO_WINDOW），不再连续闪过命令框
            - 📈 Windows / Linux 补齐内存与磁盘指标：Windows 用 GlobalMemoryStatusEx + GetDiskFreeSpaceExW，Linux 用 /proc/meminfo + statvfs。此前这两项仅在 macOS 可用，Win / Linux 一直显示为空
            - 🔢 悬浮指标条数值修正：CPU / 内存百分比此前漏乘 100（如 77% 显示成 1%）
            - 📏 悬浮指标条宽度贴合内容：不再右侧大片空白；数值定宽右对齐，位数变化时不再抖动
            - ➕ 设置页新增「显示磁盘占用」开关（默认关闭）
            - 🛡 崩溃可诊断：新增 panic 兜底钩子，闪退会在应用日志留下 PANIC 行，不再无现场
            完整版本历史见仓库 README。
          releaseDraft: false
          prerelease: false
          release: true
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: |
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe

  # ---------- Linux ----------
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential \
            curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev \
            librsvg2-dev libx11-dev pkg-config
      - name: Install frontend deps
        run: npm ci --no-audit --no-fund
      - name: Build Tauri (Linux)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --ci --target x86_64-unknown-linux-gnu
          tagName: "v__VERSION__"
          releaseName: "v__VERSION__"
          releaseBody: |
            ### 屏幕时间管家 ScreenTime Pro — v0.7.7 更新（稳定性修复）
            - 🩹 macOS 闪退修复（重要）：状态栏 / 悬浮指标条开启后 macOS 启动即崩。根因是磁盘指标采样用 statfs(2) 时输出缓冲仅 256 字节，而 Darwin struct statfs 实为 2168 字节且该 API 无长度参数，内核写满即造成栈越界写。现改用真实布局的 repr(C) 结构体接收，并加 size_of 编译期断言防回归
            - 🩹 Windows 首次启动闪黑框修复：查询 WebView2 / MachineGuid 的 reg 子进程改为无窗口方式创建（CREATE_NO_WINDOW），不再连续闪过命令框
            - 📈 Windows / Linux 补齐内存与磁盘指标：Windows 用 GlobalMemoryStatusEx + GetDiskFreeSpaceExW，Linux 用 /proc/meminfo + statvfs。此前这两项仅在 macOS 可用，Win / Linux 一直显示为空
            - 🔢 悬浮指标条数值修正：CPU / 内存百分比此前漏乘 100（如 77% 显示成 1%）
            - 📏 悬浮指标条宽度贴合内容：不再右侧大片空白；数值定宽右对齐，位数变化时不再抖动
            - ➕ 设置页新增「显示磁盘占用」开关（默认关闭）
            - 🛡 崩溃可诊断：新增 panic 兜底钩子，闪退会在应用日志留下 PANIC 行，不再无现场
            完整版本历史见仓库 README。
          releaseDraft: false
          prerelease: false
          release: true
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: |
            src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage
            src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/deb/*.deb

  # ---------- macOS (Apple Silicon) ----------
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install frontend deps
        run: npm ci --no-audit --no-fund
      - name: Build Tauri (macOS)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --ci --target aarch64-apple-darwin
          tagName: "v__VERSION__"
          releaseName: "v__VERSION__"
          releaseBody: |
            ### 屏幕时间管家 ScreenTime Pro — v0.7.7 更新（稳定性修复）
            - 🩹 macOS 闪退修复（重要）：状态栏 / 悬浮指标条开启后 macOS 启动即崩。根因是磁盘指标采样用 statfs(2) 时输出缓冲仅 256 字节，而 Darwin struct statfs 实为 2168 字节且该 API 无长度参数，内核写满即造成栈越界写。现改用真实布局的 repr(C) 结构体接收，并加 size_of 编译期断言防回归
            - 🩹 Windows 首次启动闪黑框修复：查询 WebView2 / MachineGuid 的 reg 子进程改为无窗口方式创建（CREATE_NO_WINDOW），不再连续闪过命令框
            - 📈 Windows / Linux 补齐内存与磁盘指标：Windows 用 GlobalMemoryStatusEx + GetDiskFreeSpaceExW，Linux 用 /proc/meminfo + statvfs。此前这两项仅在 macOS 可用，Win / Linux 一直显示为空
            - 🔢 悬浮指标条数值修正：CPU / 内存百分比此前漏乘 100（如 77% 显示成 1%）
            - 📏 悬浮指标条宽度贴合内容：不再右侧大片空白；数值定宽右对齐，位数变化时不再抖动
            - ➕ 设置页新增「显示磁盘占用」开关（默认关闭）
            - 🛡 崩溃可诊断：新增 panic 兜底钩子，闪退会在应用日志留下 PANIC 行，不再无现场
            完整版本历史见仓库 README。
          releaseDraft: false
          prerelease: false
          release: false
      - name: Inject Gatekeeper fix script into DMG
        # 当前构建无 Apple 签名/公证，用户打开会触发「已损坏」门禁提示。
        # 在 dmg 内注入一个 修复门禁.command：用户把 .app 拖入「应用程序」后，
        # 右键 → 打开 该脚本即可移除隔离属性（xattr -dr com.apple.quarantine），无需付费证书。
        # 脚本内联生成，不污染仓库。
        run: |
          set -e
          DMG=$(find src-tauri/target/aarch64-apple-darwin/release/bundle/dmg -name '*.dmg' | head -n1)
          echo "Found DMG: $DMG"
          hdiutil attach "$DMG" -mountpoint /tmp/stp_dmg -nobrowse -quiet
          rm -rf /tmp/stp_stage && mkdir -p /tmp/stp_stage
          cp -R /tmp/stp_dmg/. /tmp/stp_stage/
          cat > /tmp/stp_stage/修复门禁.command <<'SCRIPT'
          #!/bin/bash
          # 先移除脚本自身的隔离属性（若本脚本本身也被 Gatekeeper 拦截）
          xattr -d com.apple.quarantine "$0" 2>/dev/null || true
          APP="/Applications/ScreenTime Pro.app"
          if [ -d "$APP" ]; then
            xattr -dr com.apple.quarantine "$APP"
            osascript -e 'display dialog "已移除 ScreenTime Pro 的隔离属性，现在可以直接打开。" buttons {"好"} default button "好"' >/dev/null 2>&1
          else
            osascript -e 'display dialog "未找到 ScreenTime Pro.app。请先把应用拖入「应用程序」文件夹，再运行本脚本。" buttons {"好"} default button "好"' >/dev/null 2>&1
          fi
          SCRIPT
          chmod +x /tmp/stp_stage/修复门禁.command
          # 同时注入一份中文说明，讲清为什么被拦截、如何使用脚本或手动命令
          cat > /tmp/stp_stage/首次打开必读.txt <<'README'
          ============================================================
          ScreenTime Pro — 首次打开「已损坏 / 无法验证开发者」怎么办？
          ============================================================

          【为什么会有这个提示？】
          本应用目前没有购买 Apple 开发者证书做「公证(Notarization)」，
          因此 macOS 的 Gatekeeper 会把从网络下载的应用标记为隔离(quarantine)，
          首次打开时会提示「已损坏，无法打开」或「无法验证开发者」。
          这不是 App 本身有问题，只是系统的安全策略。

          【解决办法一（最省事，推荐）】
          1. 先把「ScreenTime Pro.app」拖进「应用程序」文件夹。
          2. 在 DMG 里【右键】「修复门禁.command」→ 选「打开」。
             ⚠️ 必须右键→打开才会看到「打开」按钮；直接双击会被系统拦截。
          3. 脚本会自动执行 xattr -dr com.apple.quarantine，弹窗提示成功后即可正常打开 App。

          【解决办法二（手动命令）】
          打开「终端」，粘贴并执行（-r 递归，确保 App 内部文件也一并清除隔离属性）：
            xattr -dr com.apple.quarantine "/Applications/ScreenTime Pro.app"
          若提示「No such xattr」，说明已无隔离属性，直接打开即可。

          处理一次之后，今后打开 App 都不再被拦截。
          README
          hdiutil detach /tmp/stp_dmg -quiet
          hdiutil create -volname "ScreenTime Pro" -srcfolder /tmp/stp_stage -ov -format UDZO "$DMG"
          echo "Injected 修复门禁.command + 首次打开必读.txt into DMG"
      - name: Upload injected DMG to Release (overwrite stale one)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          TAG="${{ github.ref_name }}"
          DMG=$(find src-tauri/target/aarch64-apple-darwin/release/bundle/dmg -name '*.dmg' | head -n1)
          echo "Injected DMG: $DMG"
          # Release 由 Windows/Linux job 创建；若尚未就绪，最多等待 ~5 分钟
          for i in $(seq 1 30); do
            if gh release view "$TAG" >/dev/null 2>&1; then break; fi
            echo "Release $TAG 尚未就绪，等待 10s ($i/30)..."
            sleep 10
          done
          gh release upload "$TAG" "$DMG" --clobber
          echo "Re-uploaded injected DMG to Release $TAG"
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-build
          path: |
            src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
