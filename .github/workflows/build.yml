          prerelease: false
          release: true
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: |
            src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage
            src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/deb/*.deb

  # ---------- macOS (Apple Silicon) ----------
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install frontend deps
        run: npm ci --no-audit --no-fund
      - name: Build Tauri (macOS)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # v1.2.11：即使 macOS **不参与**应用内升级，也必须给签名私钥。
          # 原因：`bundle.createUpdaterArtifacts: true` 是全局配置，Tauri CLI 在
          # 任何平台看到它都会尝试产出 .app.tar.gz + .sig；没有私钥则构建**直接失败**
          # （不是跳过）。所以 mac 这里是「必须签名、但不进 latest.json」。
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          args: --ci --target aarch64-apple-darwin
          # mac 的 .app.tar.gz **绝不**进 latest.json：本项目 ad-hoc 签名，
          # 签名身份每次构建都变，TCC 授权（屏幕录制/辅助功能）会整体失效。
