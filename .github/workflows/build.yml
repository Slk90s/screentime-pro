name: Build ScreenTime Pro (all platforms)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ---------- Windows ----------
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install frontend deps
        run: npm ci --no-audit --no-fund
      - name: Build Tauri (Windows)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --ci --target x86_64-pc-windows-msvc --bundles nsis
          tagName: "v__VERSION__"
          releaseName: "v__VERSION__"
          releaseBody: |
            ### 屏幕时间管家 ScreenTime Pro — v1.1.0
            #### ✨ 新功能（本版重点）
            - **重复区域截图**：截图工具条新增「再次截取」按钮——复用上一次截图的选区矩形一键重截，适合悬浮窗/监控面板等位置固定区域的重复采集；分辨率或 DPI 变化时显式报错（frame_size 守卫），不会错位截取
            - **延时截图**：截图工具条新增 3/5/10 秒倒计时——先框选再延迟抓屏，留出时间展开菜单或切换到待截界面；倒计时期间重按快捷键即取消
            - **长图置信分级**：重叠检测命中多段时标记「低置信」并以琥珀色提示条透出，建议滚动后再截一屏复核；覆盖不足时不再静默定案（三态裁决，拼错自动回滚）
            #### 🐞 修复
            - **日历活跃天数不刷新**：日历开着时本月概况不再冻结在打开那一刻的快照，改为打开即拉取 + 每 60 秒静默刷新
            - 托盘「启用状态栏」勾选、设置页开关、悬浮条实际显示三处状态同步核验通过（双向即时一致）
            #### 🧹 工程收口
            - 17 处过时「Unreleased」注释按实际落版修正（v0.7.6 / v1.0.0）
            - 长图 finish 编码失败可重试（会话还回并裁回内容段，不再二次拼接）
            - IPC 92 → **95**（延时截图 2 + 重复区域截图 1）
            #### 📊 包体积
            | 平台 | 产物 | 体积 |
            |---|---|---|
            | Windows | `-setup.exe`（NSIS 安装器） | ~27 MB |
            | macOS（Apple Silicon） | `.dmg` | ~27 MB |
            | Linux | `.deb` / `.rpm` | ~27 MB |
            | Linux | `.AppImage` | ~107 MB |
            > 完整版本历史见仓库 README。
          releaseDraft: false
          prerelease: false
          release: true
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: |
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe

