name: Build ScreenTime Pro (all platforms)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ---------- Windows ----------
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install frontend deps
        run: npm ci --no-audit --no-fund
      - name: Build Tauri (Windows)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --ci --target x86_64-pc-windows-msvc --bundles nsis
          tagName: "v__VERSION__"
          releaseName: "v__VERSION__"
          releaseBody: |
            ### 屏幕时间管家 ScreenTime Pro — v1.2.6
            #### 🐞 修复（本版重点：两个「静默失效」问题）
            - **修复「截过一次图之后就不再记录时长」**：截图遮罩窗（`ScreenTime Capture`）在 `tauri.conf.json` 里被配置成 `visible:false` 却 `focus:true`，隐藏窗在创建时**仍会成为前台窗口**，并且此后不会自行让出。Windows 上 `GetForegroundWindow()` 从那一刻起一直返回这个看不见的窗口，采样循环每次都判定「这是本程序辅助窗口」并跳过 —— 于是整段时间一条记录都不落库。实测对照（同机同库、均持续发真实鼠标事件保持非空闲）：前台为该隐藏窗时 **18 秒新增 0 条**，前台为真实应用时 **18 秒新增 1 条**。修复三处：① 该窗口 `focus` 改为 `false`（与 `pet`/`pet-menu`/`float` 三个隐藏窗保持一致）；② 采集侧新增「前台窗口不可见即跳过」的通用兜底，不再依赖标题白名单；③ 截图收尾隐藏遮罩窗后，若前台仍卡在它身上则主动让出焦点。验证：修复前 6 分钟内 `ScreenTime Capture` 跳过 **833 次**、成功采集 0 次；修复后同样运行 40 秒，跳过 **0 次**、成功采集 **32 次**，且「切到 WorkBuddy 35 秒 → 切回」能正确落库一条 34 秒记录
            - **修复 OCR 文本行排序偶发崩溃**：文字识别结果按「行」聚合时，比较器用的是**成对计算**的阈值（`(a.h + b.h) / 2 × 0.6`），导致 A≈B、B≈C 却 A<C，违反了 `sort_by` 要求的全序（strict weak ordering）。Rust 标准库检测到排序漂移会直接 panic：`user-provided comparison function does not correctly implement a total order`。日志中已捕获 2 次（`app.2026-10-18.log`），且用单文件复现出的 panic 消息与线上**逐字一致**（含 `smallsort.rs:854`）。现改为三段式排序：先按 y 中心排 → 用**全局常量**阈值（行高中位数 × 0.6，只算一次）归并出行号 → 按 (行号, x) 排，每一步都是合法全序
            #### 🔧 加固（不改统计口径）
            - **写库失败不再静默丢弃**：会话落库原为 `let _ = insert_session(...)`，失败完全无声，用户只会察觉「今天时长比实际少」却找不到任何线索。现改为记录 error 日志（含应用 / 日期 / 时长上下文），并在 DB 连接上设 `busy_timeout=5s`，让瞬时锁冲突自动重试而非直接返回 `SQLITE_BUSY`
            - **WAL 文件体积收敛**：数据库本体仅 385 KB，旁边却常驻 4.13 MB 的 `-wal`。根因不是「涨上去没降」，而是 `wal_autocheckpoint` 默认 1000 页形成的**均衡态**（1000 × 4096 = 4.1 MB）；此时只设 `journal_size_limit` 完全无效（实测 8 MB 上限对 4.1 MB 的均衡点一次都不会触发）。现设为 `wal_autocheckpoint=256` + `journal_size_limit=1MB`，两档对齐。真机库副本实测：稳态 WAL **4,132,392 B → 1,048,576 B（降 75%）**，每笔写入开销仅 +0.1 ms
            - **日志噪音治理**：采样间隔 2 秒，旧实现每次采集失败都打 WARN，「锁屏 / 无前台窗口 / 自家辅助窗抢前台」这些**正常状态**会以每小时 1800 条的速度刷日志 —— 历史累计 **9376 条**「采集前台应用失败」，占全部 WARN 的 98%。现改为「只在状态翻转时记一条」：「暂时没有前台」降为 DEBUG，恢复时补一条 INFO，真异常仍 WARN 且同类不重复
            - **DB 加固可事后核验**：`busy_timeout` / `journal_size_limit` / `wal_autocheckpoint` 都是**连接级**设置，外部工具新开连接读到的只是它自己的默认值。现于启动时回读并打印实际生效值，避免「改了但没生效」无从察觉
            - **缺图标不再导致启动崩溃**：`default_window_icon().unwrap()` 在图标资源异常时会 panic（表现为「双击没反应」），现降级为警告 + 空图标兜底
            #### 📌 升级提示
            - 若你此前遇到「用过一段时间后统计突然不再增长」，本版已修复，升级后无需额外操作
            - 已有的历史记录不会回填（缺失的那段时间当时就没有写入数据库），本版只保证**此后不再丢**
            > 完整版本历史见仓库 README。
          releaseDraft: false
          prerelease: false
          release: true
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: |
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe

  # ---------- Linux ----------
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential \
            curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev \
            librsvg2-dev libx11-dev pkg-config \
            libpipewire-0.3-dev libgbm-dev libegl1-mesa-dev
      - name: Install frontend deps
        run: npm ci --no-audit --no-fund
      - name: Build Tauri (Linux)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --ci --target x86_64-unknown-linux-gnu
          tagName: "v__VERSION__"
          releaseName: "v__VERSION__"
          releaseBody: |
