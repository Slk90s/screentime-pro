name: Build ScreenTime Pro (all platforms)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ---------- Windows ----------
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install frontend deps
        run: npm ci --no-audit --no-fund
      - name: Build Tauri (Windows)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --ci --target x86_64-pc-windows-msvc --bundles nsis
          tagName: "v__VERSION__"
          releaseName: "v__VERSION__"
          releaseBody: |
            ### 屏幕时间管家 ScreenTime Pro — 本次更新（整合 0.6.2 全部 Beta 修复）
            - 📅 日历支持月视图切换，并展示本月统计概括（月总时长 / 活跃天数 / 日均 / 最常使用 App / 最忙的一天）；点「今天」日历同步跳回当月
            - 🐼 主界面桌宠设置移除冗余的「已经吃饱啦 → 喂食」提示
            - 🍖 喂食系统修复：饿度值随喂食 +食物值、每 2 分钟自然 −1；喂食后右键菜单「+N」反馈 + 桌宠进食点头动画 + 「好吃！」气泡
            - 🛠 桌面频繁抖动修复：系统过载升温阈值由 CPU≥80% 持续 15s 上调为 ≥90% 持续 20s（<55% 持续 15s 冷却），从源头减少 0.18s 剧烈抖动翻转
            - 🌐 中英双语（zh-CN / en-US）同步
            完整版本历史见仓库 README。
          releaseDraft: false
          prerelease: false
          release: true
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: |
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe

  # ---------- Linux ----------
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential \
            curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev \
            librsvg2-dev libx11-dev pkg-config
      - name: Install frontend deps
        run: npm ci --no-audit --no-fund
      - name: Build Tauri (Linux)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --ci --target x86_64-unknown-linux-gnu
          tagName: "v__VERSION__"
          releaseName: "v__VERSION__"
          releaseBody: |
            ### 屏幕时间管家 ScreenTime Pro — 本次更新（整合 0.6.2 全部 Beta 修复）
            - 📅 日历支持月视图切换，并展示本月统计概括；点「今天」日历同步跳回当月
            - 🐼 主界面桌宠设置移除冗余的「已经吃饱啦 → 喂食」提示
            - 🍖 喂食系统修复（饿度值随喂食/衰减变化 + 喂食反馈动画）
            - 🛠 桌面频繁抖动修复（过载升温阈值上调）
            - 🌐 中英双语（zh-CN / en-US）同步
            完整版本历史见仓库 README。
          releaseDraft: false
          prerelease: false
          release: true
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: |
            src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage
            src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/deb/*.deb

  # ---------- macOS (Apple Silicon) ----------
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install frontend deps
        run: npm ci --no-audit --no-fund
      - name: Build Tauri (macOS)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --ci --target aarch64-apple-darwin
          tagName: "v__VERSION__"
          releaseName: "v__VERSION__"
          releaseBody: |
            ### 屏幕时间管家 ScreenTime Pro — 本次更新（整合 0.6.2 全部 Beta 修复）
            - 📅 日历支持月视图切换，并展示本月统计概括；点「今天」日历同步跳回当月
            - 🐼 主界面桌宠设置移除冗余的「已经吃饱啦 → 喂食」提示
            - 🍖 喂食系统修复（饿度值随喂食/衰减变化 + 喂食反馈动画）
            - 🛠 桌面频繁抖动修复（过载升温阈值上调）
            - 🌐 中英双语（zh-CN / en-US）同步
            完整版本历史见仓库 README。
          releaseDraft: false
          prerelease: false
          release: true
      - name: Inject Gatekeeper fix script into DMG
        # 当前构建无 Apple 签名/公证，用户打开会触发「已损坏」门禁提示。
        # 在 dmg 内注入一个 修复门禁.command：用户把 .app 拖入「应用程序」后，
        # 右键 → 打开 该脚本即可移除隔离属性（xattr -dr com.apple.quarantine），无需付费证书。
        # 脚本内联生成，不污染仓库。
        run: |
          set -e
          DMG=$(find src-tauri/target/aarch64-apple-darwin/release/bundle/dmg -name '*.dmg' | head -n1)
          echo "Found DMG: $DMG"
          hdiutil attach "$DMG" -mountpoint /tmp/stp_dmg -nobrowse -quiet
          rm -rf /tmp/stp_stage && mkdir -p /tmp/stp_stage
          cp -R /tmp/stp_dmg/. /tmp/stp_stage/
          cat > /tmp/stp_stage/修复门禁.command <<'SCRIPT'
          #!/bin/bash
          # 先移除脚本自身的隔离属性（若本脚本本身也被 Gatekeeper 拦截）
          xattr -d com.apple.quarantine "$0" 2>/dev/null || true
          APP="/Applications/ScreenTime Pro.app"
          if [ -d "$APP" ]; then
            xattr -dr com.apple.quarantine "$APP"
            osascript -e 'display dialog "已移除 ScreenTime Pro 的隔离属性，现在可以直接打开。" buttons {"好"} default button "好"' >/dev/null 2>&1
          else
            osascript -e 'display dialog "未找到 ScreenTime Pro.app。请先把应用拖入「应用程序」文件夹，再运行本脚本。" buttons {"好"} default button "好"' >/dev/null 2>&1
          fi
          SCRIPT
          chmod +x /tmp/stp_stage/修复门禁.command
          hdiutil detach /tmp/stp_dmg -quiet
          hdiutil create -volname "ScreenTime Pro" -srcfolder /tmp/stp_stage -ov -format UDZO "$DMG"
          echo "Injected 修复门禁.command into DMG"
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-build
          path: |
            src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
