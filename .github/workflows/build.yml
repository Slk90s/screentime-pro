name: Build ScreenTime Pro (all platforms)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ---------- Windows ----------
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install frontend deps
        run: npm ci --no-audit --no-fund
      - name: Build Tauri (Windows)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # v1.2.11：updater 强制要求 ed25519 签名，没有这个 key 构建会直接失败。
          # 用 --ci 生成的无密码私钥，所以不需要 _PASSWORD 变量。
          # 🔴 私钥丢失 = 已安装用户永久无法再收到更新（客户端只认硬编码公钥）。
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          args: --ci --target x86_64-pc-windows-msvc --bundles nsis
          # v1.2.11：**关掉** tauri-action 自带的 latest.json 上传。
          # 三个平台是三个独立 runner，各自只会写出「自己那一个平台」的条目，
          # 后跑的会覆盖先跑的 → 最终线上 latest.json 只剩最后一个平台，
          # 另两个平台 check() 直接 Err(TargetsNotFound)。
          # 正确做法是末尾的 updater-json 作业汇总所有平台后再上传一次（见文件末尾）。
          includeUpdaterJson: false
          tagName: "v__VERSION__"
          releaseName: "v__VERSION__"
          releaseBody: |
            ### 屏幕时间管家 ScreenTime Pro — v1.2.12

            > **本版一次交付两个版本的内容**：v1.2.11 从未发布过（远端无该 tag），若跳过它，你从 v1.2.10 升上来就看不到「截完图闪退」已被修好的说明 —— 那是本版最该知道的一件事。所以本正文同时覆盖 v1.2.11 与 v1.2.12。

            ---

            ## 🔴 先说最重要的：macOS「截完图闪退」已修复

            **症状**：第一次截图只有半个屏幕，第二次截图正常，然后应用**整个消失** —— 没有报错弹窗，托盘图标也没了。

            **根因**（三层叠加，缺一不可）：

            1. **下载校验形同虚设**。增强取字引擎的运行库不随包（macOS / Linux），运行时从 Release 下载。旧实现里摘要校验在拉不到 `.sha256` 时**直接放行**，而下载只看 HTTP 200、不看字节数 —— 连接中途被切断时，一份残缺的运行库被当成下载成功。
            2. **落盘非原子**。直写目标路径，写到一半进程退出就留下半截文件；而「运行库是否就绪」只判断文件存在与否 —— 半截文件被认定为已就绪，**此后每次启动都崩**。
            3. **取字库的失败路径是 `expect(...)`**，而 release 构建配的是 `panic = "abort"`。第三方库一次内部断言失败 = `process::abort()`，没有任何错误出口可以捕获。

            **修法**（四层，缺一不可）：

            - **下载原子化**：先写 `.tmp` → 体积闸门（≥ 8MB）→ 摘要三态（匹配 / 不匹配 / 无从校验）→ **回读长度复核** → 原子 `rename`。不变式：目标路径要么不存在，要么是一份通过校验的完整文件。
            - **加载前自检**：新增运行库体检 —— 体积 + 平台魔数（PE / Mach-O / ELF）+ **真正 dlopen 一次并调 `OrtGetApiBase` / `GetApi`**。已损坏的缓存文件会被识别并删除，让存量用户**自动走出坑**，而不是继续崩。通过结果按（路径, 长度, mtime）缓存，不会每张截图都重复映射几十 MB 动态库。
            - **失败不再假报成功**：环境初始化在载入之前先体检，不合格直接返回错误且**不写「已就绪」标记**（旧实现里那一步完全不碰取字库的 API，所以「初始化通过」本身就是假信号）。
            - **进程不再被强制终止**：`panic` 由 `abort` 改回 **`unwind`**，并在取字的两个入口包 `catch_unwind`。即便将来第三方库在别处 panic，也只会让**本次取字报错**，应用继续运行。

            代价：安装包增大约 15%（unwind 表）。换的是不再有静默闪退。

            **顺带修掉一个更危险的分支**：如果本机缺 VC++ 运行库，随包的运行库会被旧的体检逻辑判成「文件损坏」并**删除** —— 而 Windows 没有下载通道，只能重装。现在「环境缺依赖」与「文件真坏了」分开判定：前者保留文件并提示装运行库，后者才删，且**只删我们自己下载的那份**，绝不动随包文件。

            ## 🔴 第二次：第一次截图只有半个屏幕

            抓屏本身是对的（日志两次都是 2560×1440）。真正原因是**启动事件丢了**。

            截图遮罩窗是**懒创建**的（首次截图才建，且先隐藏）。首次截图时界面正在从头加载整个前端，而事件是**即发即弃**的 —— 监听器还没注册，事件就被丢弃。于是遮罩拿不到屏幕尺寸，只能用窗口创建时的默认值（800×600）推算：全选只有半个屏，缩放比例算错，导出图尺寸跟着错。第二次截图时窗口已存在、页面就绪，所以「恢复正常」。

            **修法**：

            - 事件之外**再存一份**到后端状态，新增 `take_capture_ready` 命令，取走即清空。前端监听注册完成后**主动拉一次**兜底 —— 事件与拉取谁先到都不会重复初始化。
            - 去重判据从布尔值换成**后端自增的序号**。布尔值分不清「同一帧的重复投递」与「遮罩还开着时你又按了一次截图键」，后者会被当成重复而**吞掉新帧** —— 你框的是上一秒的画面，导出的却是这一秒的内容。
            - 初始化收敛成单一入口并做**代际守卫**，防止「用户已按 Esc 取消，上一轮异步结果回来又把画面写回去」。
            - 等待一次 DOM 更新 + 一帧渲染再取窗口几何 —— 窗口尺寸设置返回不代表界面已完成重排。
            - 选区与导出尺寸改用**载荷里的宽高**（而非窗口内宽），缩放比例优先用载荷的 `scale_factor`。窗口何时重排都不再影响选区。

            ## ✨ 新增：应用内自动升级（Windows / Linux AppImage）

            以前「发现新版本」只能跳浏览器手动下载。本版接入 Tauri 官方 updater：检查 → 下载 → **ed25519 验签** → 交给平台安装器，全程在应用内完成。

            - **Windows**：拉起 NSIS 安装包后**进程会立即退出**（upstream 在 `ShellExecuteW` 之后直接 `process::exit(0)`），安装器接管，装完自动重启。这不是崩溃。
            - **Linux（仅 AppImage）**：原地覆盖自身并自动重启。**deb / rpm 包不参与** —— 那两种走 `pkexec dpkg -i` / `rpm -U`，每次升级都要过一次系统授权框，本就应该由包管理器接手（`apt upgrade` / `dnf upgrade`）。应用会识别自己的包型，deb/rpm 用户点「检查更新」仍只会看到「前往下载」。
            - **签名不可关闭**：客户端硬编码公钥，只认用对应私钥签过的包。这条是安全底线，也是**私钥丢失 = 已安装用户永久收不到更新**的原因。

            ## ✨ 新增：桌宠拖拽跟手，重启后自己回来

            **拖动桌宠终于不掉队、不回跳。** 三处叠加的根因：

            1. **权限清单少一行**。桌宠窗口的权限里没有 `core:window:allow-start-dragging`，前端的系统级拖拽请求每次都被权限层拒绝，程序静默回退到「每帧跨进程搬一次窗口」。这意味着历史版本里那句「拖拽卡顿已根治」其实**从未生效** —— 修的是回退路径，入口一直是死的。
            2. **原生拖拽这条路走不通，三端都不用**。补上权限后在 Windows / Linux 上原生拖拽第一次真正生效，但随即发现它有个绕不过去的硬伤：**拿不到「松手」这个信号**。系统把拖拽交给 `DefWindowProc` 的模态移动循环，真实的 `WM_LBUTTONUP` 被它自己吃掉（底层库要在 `WM_EXITSIZEMOVE` 里手动补发一个），而这个补发事件并不会转发到网页层 —— 前端永远等不到 `pointerup`。于是改成**三端统一走新增的 Rust 侧拖拽循环**：按下时只记抓取偏移，之后每 8ms 由后端读**全局光标**自己搬窗，位移不足 4px 不发。这条路径 macOS 上已经用了几个版本，副作用是拖拽期最多每秒百余次**进程内**的位置投递（不是跨进程 IPC），实测跟手。
            3. **收尾位置取「自己发出的最后一个目标」而非查询窗口**。设位置是异步投递的，刚投的几帧还没落到系统里，去问只能问出历史值 —— 写进持久化就是「拖完回跳」。

            读全局光标这一点同时解决了旧写法的结构缺陷：鼠标一甩出宠物身体范围，网页就收不到移动事件，桌宠当场落后、松手又跳一下。

            **跨不同缩放比例的显示器也不跳了。** 拖拽全程改用**各平台自己的坐标空间**，缩放系数只在拖拽开始和结束各用一次，中间每秒百余次的位移计算里一次换算都没有。此前是「开始时除一次、设位置时又乘一次」，同一块屏上正好抵消，但宠物拖到另一块缩放比例不同的显示器上时两边用的系数就不是同一个了，位移会被等比放大。


            **重启后桌宠回来了。** 此前设置里明明开着，重启后宠物不出现、开关却还显示「开」，要进设置页关一次再开才出来。现在宠物窗口启动时会按持久化开关自动恢复尺寸与位置（顺序是「先定尺寸 → 再纠偏定位 → 最后显示」，反过来会先以默认尺寸露出一帧再撑大）。

            **不再把桌宠丢在屏幕外。** 拖出边缘允许，松手后自动回到看得见的位置；副屏拔掉或分辨率变化后重启，也不会恢复成离屏坐标。这套校验抽成了公共模块，与悬浮指标条**共用同一判据** —— 顺带补上它原先只查横向、不查纵向的漏洞（纵向甩出屏外原来一路放行）。

            **Linux 侧省掉高频建连。** 读鼠标位置此前每次都新建一条 X 连接（约每秒 18 次，加上拖拽循环还会再叠一条更高频的），现改为按线程缓存、连接失效自动重连。

            ## 🐞 修复：锁屏时间被计入使用时长

            锁屏界面（macOS `loginwindow`、Windows `LockApp` / `LogonUI`、Linux `gdm` / `sddm` 等）此前被当成普通应用统计。日志里 `loginwindow` 从 04:46 连续被记到 05:27，每小时都在涨。

            改为：命中即**结束当前会话**并跳过本次采样（与「无前台窗口」同等对待）。判据是**精确进程名**，刻意不用包含匹配 —— 按 `lock` 做包含匹配会把 `unlock-app`、`BlockchainWallet` 这类正常应用误杀成「不计时」。

            ## 🐞 修复：分类失败被写进永久缓存

            应用分类靠在线查询，失败时回落到「其他」。旧实现把这个回落值也写进了**永久缓存** —— 于是这条记录此后永远返回「其他」，网络恢复也不重试。日志里那批反复失败的应用名即此。

            改为**负缓存 + 10 分钟过期**：失败只进负缓存（避免断网时每次采样都打一次超时请求），过期自动重试；一旦拿到确定分类就清除负缓存。

            ## 🐞 修复：辅助功能已授权，应用却仍报「未授权」

            **症状**：系统设置 → 隐私与安全性 → 辅助功能里，本应用的开关**明明是开着的**，应用自己的设置页仍显示「辅助功能 ❌未授权」。

            **根因**（三层叠加，缺一不可）：

            1. **TCC 授权是按进程快照的**。用户把开关打开时应用正在运行，那个进程拿不到新授权 —— 必须重启进程才生效，但界面上没有任何引导。
            2. **ad-hoc 签名让授权记录指向「上一份二进制」**。CI 没有 `APPLE_SIGNING_IDENTITY`，每次构建的 cdhash 都不同；TCC 记录按「路径 + cdhash」绑定，于是升级后旧记录失效，而系统设置界面显示的仍是开关状态。
            3. **设置页的提示条件写反了**，且「重置」按钮只清屏幕录制、不清辅助功能 —— 文案说「重置并重启」，实际清的是另一个服务，用户白忙。

            **修法**：提示条件改正；重置按钮按服务分流（`tccutil reset Accessibility` / `ScreenCapture`）；辅助功能行也补上独立的重置入口；提示文案改为专门的辅助功能说明（不再与屏幕录制共用一条）。

            顺带确认：**辅助功能对本应用并非功能必需**。空闲检测用的是 `CGEventSourceSecondsSinceLastEventType`，不需要该权限；它只用于设置页的状态显示。所以即使不授权，计时本身是准的。

            ## ⚠️ 改动说明：磁盘占用百分比会变（是修复，不是回归）

            三端此前的口径不一致：Linux 按「普通用户可用空间」、macOS 按「含管理员保留块的空闲」、Windows 按「全盘空闲未扣配额」。同一块默认预留 5% 的 ext4 分区，在 Linux 上会显示得比另外两端**更满**。

            现统一为 `已用 = 总量 − 当前用户可用`。所以本版之后你在 Linux 上看到的磁盘百分比会比以前**低一点**，Windows / macOS 也可能有细微变化 —— 这是口径对齐的结果。

            多盘枚举的能力已经落到后端，但**界面上的多盘卡片本版还没接**。所以如果你有多块硬盘，只会看到口径变化，不会看到新卡片。

            ## 📌 已知局限（请务必先读）

            - **macOS 不参与自动升级**。两个独立理由：(a) ad-hoc 签名会让「升级后授权失效」每次都复发，自动升级等于把这个坑自动化；(b) `latest.json` 缺 macOS 条目时，updater 返回的是「找不到目标平台」这种硬错误而非「无更新」，会让 macOS 用户每次启动都在日志里刷一条错误。macOS 用户请继续从发布页下载 DMG，仍会照常提示「发现新版本」并给出下载链接。
            - **deb / rpm 包不参与自动升级**。用包管理器升级即可，应用会正确识别并只给下载链接。
            - **Windows 升级时进程会突然消失**，这是 NSIS 安装器接管的正常表现，不是崩溃。
            - **本版 macOS 侧改动仍未经真机目视复验**：拖拽跟手（快速横甩 400px 不掉队、不回跳）、重启后按上次位置恢复、离屏坐标落回可见区，这三条都需要在实体 Mac 上跑过才算数。权限中心文案在紧凑弹窗里是否被截断、截图遮罩在 Retina 屏上的实际观感同样未复验。若有不符请发截图到 issue。
            - **Windows / Linux 的拖拽观感未经长时间使用检验**：本版把原生拖拽整体换成了后端循环（原因见上），跟手度靠的是每秒百余次的进程内位置投递。开发机上短期拖动正常，但**尚未做过长时间、频繁拖拽的压力观察**，也没有与旧版原生拖拽做过并排对比。若你感觉不如以前顺滑，请反馈具体的屏幕缩放比例与显示器数量。
            - **跨缩放比例多屏的拖拽坐标已按代码逻辑修正，但未在异构 DPI 双屏上实测**：开发机是单一缩放比例，无法覆盖「宠物从 100% 屏拖到 150% 屏」这条路径。相关换算有单测对拍（往返无损），但单测证明不了观感。
            - **桌宠状态仍只存在本地浏览器存储里**，不在数据库备份范围内 —— 换设备或清理应用数据后，等级与喂食记录会丢。这是已知技术债，计划在后续版本迁移。

            ## ✅ 验证

            - `cargo test --lib` **61 passed / 0 failed / 5 ignored**（本版新增 21 个回归测试）/ `vue-tsc --noEmit` 零错误 / `vite build` 通过。
            - **`cargo clippy --all-targets` 与 `--lib` 同为 52 条且完全同集** —— 测试代码里不再多出任何告警，口径干净。这 52 条是既存基线，本版未新增。
            - **`panic = "unwind"` 在 release 配置下实测有效**：单独跑了一次 `cargo test --release`（`lto = true` 全量重编，约 14 分钟），结论是取字库内部的 panic 被 `catch_unwind` 捕获、测试以 `ok` 收尾。若有人把 `panic` 改回 `abort`，这个测试会让 test binary **硬崩**而不是 FAILED —— 这就是最强的回归信号。**注意：dev 档默认就是 unwind，只有 release 档跑过才算验证。**
            - **损坏运行库的判定做了双向锁定**：四类伪造样本（体积不足 / 魔数不对 / 截断 / 假文件）全部被拒；「缺依赖不等于文件损坏」与「只删自己下载的那份」各有独立测试，防止将来有人把破坏性分支改回去。
            - **截图序号单调性有独立测试**，锁死「同一帧不重复消费、新一轮必须刷新」。
            - **Linux 分支代码在 Windows 上被条件编译掉**，等于从未验证。已用「独立探针 crate 引真实源码」单独编译，并做**反证**（故意注入一个不存在的 API，确认报错而不是静默通过）。反证还踩到两个坑并记入文档：本机 `python` 是 Microsoft Store 占位程序会静默 no-op；cargo 的 mtime 指纹在同秒内改文件会误判为无需重编 —— 判据是「输出里必须出现重编那一行」。
            - **macOS 分支的编译验证无法在本机完成**（Windows 上交叉编译缺 Apple 工具链，`cc-rs` 找不到 `cc`），相关改动只做过人工类型核对。这是已知局限，不是已验证。

            > 完整版本历史见仓库 README。
          releaseDraft: false
          prerelease: false
          release: true
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: |
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe.sig

  # ---------- Linux ----------
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential \
            curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev \
            librsvg2-dev libx11-dev pkg-config \
            libpipewire-0.3-dev libgbm-dev libegl1-mesa-dev
      - name: Install frontend deps
        run: npm ci --no-audit --no-fund
      - name: Build Tauri (Linux)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          # 🔴 v1.2.12 实测订正（原注释是 Tauri v1 时代的残留，会误导排查方向）：
          # Linux 实际只产出 3 个包 + 1 个签名，**不生成 .AppImage.tar.gz**：
          #   Finished 3 bundles at:  …/deb/….deb, …/rpm/….rpm,
          #                           …/appimage/…_amd64.AppImage   ← 未压缩
          #   Finished 1 updater signature at: …appimage/…_amd64.AppImage.sig
          # 即 `createUpdaterArtifacts: true` 在 Tauri 2 下直接签**裸 AppImage**。
          # 客户端**只会用 AppImage** 那份（deb/rpm 在 install_supported() 里被拒）。
          # `install_appimage` 两种都认：先 `infer::archive::is_gz(bytes)` 判断，
          # 是 gz 才 tar 解包取 .AppImage，不是就 `std::fs::write` 原样覆盖
          # （tauri-plugin-updater 2.12.0 src/updater.rs:1083）。
          # 所以 latest.json 里放裸 AppImage 的 url + .AppImage.sig 的内容即可，
          # 详见 .github/scripts/gen_latest_json.py 的 TARGETS 注释。
          args: --ci --target x86_64-unknown-linux-gnu
          includeUpdaterJson: false
          tagName: "v__VERSION__"
          releaseName: "v__VERSION__"
          releaseBody: |
            ### 屏幕时间管家 ScreenTime Pro — v1.2.12

            > **本版一次交付两个版本的内容**：v1.2.11 从未发布过（远端无该 tag），若跳过它，你从 v1.2.10 升上来就看不到「截完图闪退」已被修好的说明 —— 那是本版最该知道的一件事。所以本正文同时覆盖 v1.2.11 与 v1.2.12。

            ---

            ## 🔴 先说最重要的：macOS「截完图闪退」已修复

            **症状**：第一次截图只有半个屏幕，第二次截图正常，然后应用**整个消失** —— 没有报错弹窗，托盘图标也没了。

            **根因**（三层叠加，缺一不可）：

            1. **下载校验形同虚设**。增强取字引擎的运行库不随包（macOS / Linux），运行时从 Release 下载。旧实现里摘要校验在拉不到 `.sha256` 时**直接放行**，而下载只看 HTTP 200、不看字节数 —— 连接中途被切断时，一份残缺的运行库被当成下载成功。
            2. **落盘非原子**。直写目标路径，写到一半进程退出就留下半截文件；而「运行库是否就绪」只判断文件存在与否 —— 半截文件被认定为已就绪，**此后每次启动都崩**。
            3. **取字库的失败路径是 `expect(...)`**，而 release 构建配的是 `panic = "abort"`。第三方库一次内部断言失败 = `process::abort()`，没有任何错误出口可以捕获。

            **修法**（四层，缺一不可）：

            - **下载原子化**：先写 `.tmp` → 体积闸门（≥ 8MB）→ 摘要三态（匹配 / 不匹配 / 无从校验）→ **回读长度复核** → 原子 `rename`。不变式：目标路径要么不存在，要么是一份通过校验的完整文件。
            - **加载前自检**：新增运行库体检 —— 体积 + 平台魔数（PE / Mach-O / ELF）+ **真正 dlopen 一次并调 `OrtGetApiBase` / `GetApi`**。已损坏的缓存文件会被识别并删除，让存量用户**自动走出坑**，而不是继续崩。通过结果按（路径, 长度, mtime）缓存，不会每张截图都重复映射几十 MB 动态库。
            - **失败不再假报成功**：环境初始化在载入之前先体检，不合格直接返回错误且**不写「已就绪」标记**（旧实现里那一步完全不碰取字库的 API，所以「初始化通过」本身就是假信号）。
            - **进程不再被强制终止**：`panic` 由 `abort` 改回 **`unwind`**，并在取字的两个入口包 `catch_unwind`。即便将来第三方库在别处 panic，也只会让**本次取字报错**，应用继续运行。

            代价：安装包增大约 15%（unwind 表）。换的是不再有静默闪退。

            **顺带修掉一个更危险的分支**：如果本机缺 VC++ 运行库，随包的运行库会被旧的体检逻辑判成「文件损坏」并**删除** —— 而 Windows 没有下载通道，只能重装。现在「环境缺依赖」与「文件真坏了」分开判定：前者保留文件并提示装运行库，后者才删，且**只删我们自己下载的那份**，绝不动随包文件。

            ## 🔴 第二次：第一次截图只有半个屏幕

            抓屏本身是对的（日志两次都是 2560×1440）。真正原因是**启动事件丢了**。

            截图遮罩窗是**懒创建**的（首次截图才建，且先隐藏）。首次截图时界面正在从头加载整个前端，而事件是**即发即弃**的 —— 监听器还没注册，事件就被丢弃。于是遮罩拿不到屏幕尺寸，只能用窗口创建时的默认值（800×600）推算：全选只有半个屏，缩放比例算错，导出图尺寸跟着错。第二次截图时窗口已存在、页面就绪，所以「恢复正常」。

            **修法**：

            - 事件之外**再存一份**到后端状态，新增 `take_capture_ready` 命令，取走即清空。前端监听注册完成后**主动拉一次**兜底 —— 事件与拉取谁先到都不会重复初始化。
            - 去重判据从布尔值换成**后端自增的序号**。布尔值分不清「同一帧的重复投递」与「遮罩还开着时你又按了一次截图键」，后者会被当成重复而**吞掉新帧** —— 你框的是上一秒的画面，导出的却是这一秒的内容。
            - 初始化收敛成单一入口并做**代际守卫**，防止「用户已按 Esc 取消，上一轮异步结果回来又把画面写回去」。
            - 等待一次 DOM 更新 + 一帧渲染再取窗口几何 —— 窗口尺寸设置返回不代表界面已完成重排。
            - 选区与导出尺寸改用**载荷里的宽高**（而非窗口内宽），缩放比例优先用载荷的 `scale_factor`。窗口何时重排都不再影响选区。

            ## ✨ 新增：应用内自动升级（Windows / Linux AppImage）

            以前「发现新版本」只能跳浏览器手动下载。本版接入 Tauri 官方 updater：检查 → 下载 → **ed25519 验签** → 交给平台安装器，全程在应用内完成。

            - **Windows**：拉起 NSIS 安装包后**进程会立即退出**（upstream 在 `ShellExecuteW` 之后直接 `process::exit(0)`），安装器接管，装完自动重启。这不是崩溃。
            - **Linux（仅 AppImage）**：原地覆盖自身并自动重启。**deb / rpm 包不参与** —— 那两种走 `pkexec dpkg -i` / `rpm -U`，每次升级都要过一次系统授权框，本就应该由包管理器接手（`apt upgrade` / `dnf upgrade`）。应用会识别自己的包型，deb/rpm 用户点「检查更新」仍只会看到「前往下载」。
            - **签名不可关闭**：客户端硬编码公钥，只认用对应私钥签过的包。这条是安全底线，也是**私钥丢失 = 已安装用户永久收不到更新**的原因。

            ## ✨ 新增：桌宠拖拽跟手，重启后自己回来

            **拖动桌宠终于不掉队、不回跳。** 三处叠加的根因：

            1. **权限清单少一行**。桌宠窗口的权限里没有 `core:window:allow-start-dragging`，前端的系统级拖拽请求每次都被权限层拒绝，程序静默回退到「每帧跨进程搬一次窗口」。这意味着历史版本里那句「拖拽卡顿已根治」其实**从未生效** —— 修的是回退路径，入口一直是死的。
            2. **原生拖拽这条路走不通，三端都不用**。补上权限后在 Windows / Linux 上原生拖拽第一次真正生效，但随即发现它有个绕不过去的硬伤：**拿不到「松手」这个信号**。系统把拖拽交给 `DefWindowProc` 的模态移动循环，真实的 `WM_LBUTTONUP` 被它自己吃掉（底层库要在 `WM_EXITSIZEMOVE` 里手动补发一个），而这个补发事件并不会转发到网页层 —— 前端永远等不到 `pointerup`。于是改成**三端统一走新增的 Rust 侧拖拽循环**：按下时只记抓取偏移，之后每 8ms 由后端读**全局光标**自己搬窗，位移不足 4px 不发。这条路径 macOS 上已经用了几个版本，副作用是拖拽期最多每秒百余次**进程内**的位置投递（不是跨进程 IPC），实测跟手。
            3. **收尾位置取「自己发出的最后一个目标」而非查询窗口**。设位置是异步投递的，刚投的几帧还没落到系统里，去问只能问出历史值 —— 写进持久化就是「拖完回跳」。

            读全局光标这一点同时解决了旧写法的结构缺陷：鼠标一甩出宠物身体范围，网页就收不到移动事件，桌宠当场落后、松手又跳一下。

            **跨不同缩放比例的显示器也不跳了。** 拖拽全程改用**各平台自己的坐标空间**，缩放系数只在拖拽开始和结束各用一次，中间每秒百余次的位移计算里一次换算都没有。此前是「开始时除一次、设位置时又乘一次」，同一块屏上正好抵消，但宠物拖到另一块缩放比例不同的显示器上时两边用的系数就不是同一个了，位移会被等比放大。


            **重启后桌宠回来了。** 此前设置里明明开着，重启后宠物不出现、开关却还显示「开」，要进设置页关一次再开才出来。现在宠物窗口启动时会按持久化开关自动恢复尺寸与位置（顺序是「先定尺寸 → 再纠偏定位 → 最后显示」，反过来会先以默认尺寸露出一帧再撑大）。

            **不再把桌宠丢在屏幕外。** 拖出边缘允许，松手后自动回到看得见的位置；副屏拔掉或分辨率变化后重启，也不会恢复成离屏坐标。这套校验抽成了公共模块，与悬浮指标条**共用同一判据** —— 顺带补上它原先只查横向、不查纵向的漏洞（纵向甩出屏外原来一路放行）。

            **Linux 侧省掉高频建连。** 读鼠标位置此前每次都新建一条 X 连接（约每秒 18 次，加上拖拽循环还会再叠一条更高频的），现改为按线程缓存、连接失效自动重连。

            ## 🐞 修复：锁屏时间被计入使用时长

            锁屏界面（macOS `loginwindow`、Windows `LockApp` / `LogonUI`、Linux `gdm` / `sddm` 等）此前被当成普通应用统计。日志里 `loginwindow` 从 04:46 连续被记到 05:27，每小时都在涨。

            改为：命中即**结束当前会话**并跳过本次采样（与「无前台窗口」同等对待）。判据是**精确进程名**，刻意不用包含匹配 —— 按 `lock` 做包含匹配会把 `unlock-app`、`BlockchainWallet` 这类正常应用误杀成「不计时」。

            ## 🐞 修复：分类失败被写进永久缓存

            应用分类靠在线查询，失败时回落到「其他」。旧实现把这个回落值也写进了**永久缓存** —— 于是这条记录此后永远返回「其他」，网络恢复也不重试。日志里那批反复失败的应用名即此。

            改为**负缓存 + 10 分钟过期**：失败只进负缓存（避免断网时每次采样都打一次超时请求），过期自动重试；一旦拿到确定分类就清除负缓存。

            ## 🐞 修复：辅助功能已授权，应用却仍报「未授权」

            **症状**：系统设置 → 隐私与安全性 → 辅助功能里，本应用的开关**明明是开着的**，应用自己的设置页仍显示「辅助功能 ❌未授权」。

            **根因**（三层叠加，缺一不可）：

            1. **TCC 授权是按进程快照的**。用户把开关打开时应用正在运行，那个进程拿不到新授权 —— 必须重启进程才生效，但界面上没有任何引导。
            2. **ad-hoc 签名让授权记录指向「上一份二进制」**。CI 没有 `APPLE_SIGNING_IDENTITY`，每次构建的 cdhash 都不同；TCC 记录按「路径 + cdhash」绑定，于是升级后旧记录失效，而系统设置界面显示的仍是开关状态。
            3. **设置页的提示条件写反了**，且「重置」按钮只清屏幕录制、不清辅助功能 —— 文案说「重置并重启」，实际清的是另一个服务，用户白忙。

            **修法**：提示条件改正；重置按钮按服务分流（`tccutil reset Accessibility` / `ScreenCapture`）；辅助功能行也补上独立的重置入口；提示文案改为专门的辅助功能说明（不再与屏幕录制共用一条）。

            顺带确认：**辅助功能对本应用并非功能必需**。空闲检测用的是 `CGEventSourceSecondsSinceLastEventType`，不需要该权限；它只用于设置页的状态显示。所以即使不授权，计时本身是准的。

            ## ⚠️ 改动说明：磁盘占用百分比会变（是修复，不是回归）

            三端此前的口径不一致：Linux 按「普通用户可用空间」、macOS 按「含管理员保留块的空闲」、Windows 按「全盘空闲未扣配额」。同一块默认预留 5% 的 ext4 分区，在 Linux 上会显示得比另外两端**更满**。

            现统一为 `已用 = 总量 − 当前用户可用`。所以本版之后你在 Linux 上看到的磁盘百分比会比以前**低一点**，Windows / macOS 也可能有细微变化 —— 这是口径对齐的结果。

            多盘枚举的能力已经落到后端，但**界面上的多盘卡片本版还没接**。所以如果你有多块硬盘，只会看到口径变化，不会看到新卡片。

            ## 📌 已知局限（请务必先读）

            - **macOS 不参与自动升级**。两个独立理由：(a) ad-hoc 签名会让「升级后授权失效」每次都复发，自动升级等于把这个坑自动化；(b) `latest.json` 缺 macOS 条目时，updater 返回的是「找不到目标平台」这种硬错误而非「无更新」，会让 macOS 用户每次启动都在日志里刷一条错误。macOS 用户请继续从发布页下载 DMG，仍会照常提示「发现新版本」并给出下载链接。
            - **deb / rpm 包不参与自动升级**。用包管理器升级即可，应用会正确识别并只给下载链接。
            - **Windows 升级时进程会突然消失**，这是 NSIS 安装器接管的正常表现，不是崩溃。
            - **本版 macOS 侧改动仍未经真机目视复验**：拖拽跟手（快速横甩 400px 不掉队、不回跳）、重启后按上次位置恢复、离屏坐标落回可见区，这三条都需要在实体 Mac 上跑过才算数。权限中心文案在紧凑弹窗里是否被截断、截图遮罩在 Retina 屏上的实际观感同样未复验。若有不符请发截图到 issue。
            - **Windows / Linux 的拖拽观感未经长时间使用检验**：本版把原生拖拽整体换成了后端循环（原因见上），跟手度靠的是每秒百余次的进程内位置投递。开发机上短期拖动正常，但**尚未做过长时间、频繁拖拽的压力观察**，也没有与旧版原生拖拽做过并排对比。若你感觉不如以前顺滑，请反馈具体的屏幕缩放比例与显示器数量。
            - **跨缩放比例多屏的拖拽坐标已按代码逻辑修正，但未在异构 DPI 双屏上实测**：开发机是单一缩放比例，无法覆盖「宠物从 100% 屏拖到 150% 屏」这条路径。相关换算有单测对拍（往返无损），但单测证明不了观感。
            - **桌宠状态仍只存在本地浏览器存储里**，不在数据库备份范围内 —— 换设备或清理应用数据后，等级与喂食记录会丢。这是已知技术债，计划在后续版本迁移。

            ## ✅ 验证

            - `cargo test --lib` **61 passed / 0 failed / 5 ignored**（本版新增 21 个回归测试）/ `vue-tsc --noEmit` 零错误 / `vite build` 通过。
            - **`cargo clippy --all-targets` 与 `--lib` 同为 52 条且完全同集** —— 测试代码里不再多出任何告警，口径干净。这 52 条是既存基线，本版未新增。
            - **`panic = "unwind"` 在 release 配置下实测有效**：单独跑了一次 `cargo test --release`（`lto = true` 全量重编，约 14 分钟），结论是取字库内部的 panic 被 `catch_unwind` 捕获、测试以 `ok` 收尾。若有人把 `panic` 改回 `abort`，这个测试会让 test binary **硬崩**而不是 FAILED —— 这就是最强的回归信号。**注意：dev 档默认就是 unwind，只有 release 档跑过才算验证。**
            - **损坏运行库的判定做了双向锁定**：四类伪造样本（体积不足 / 魔数不对 / 截断 / 假文件）全部被拒；「缺依赖不等于文件损坏」与「只删自己下载的那份」各有独立测试，防止将来有人把破坏性分支改回去。
            - **截图序号单调性有独立测试**，锁死「同一帧不重复消费、新一轮必须刷新」。
            - **Linux 分支代码在 Windows 上被条件编译掉**，等于从未验证。已用「独立探针 crate 引真实源码」单独编译，并做**反证**（故意注入一个不存在的 API，确认报错而不是静默通过）。反证还踩到两个坑并记入文档：本机 `python` 是 Microsoft Store 占位程序会静默 no-op；cargo 的 mtime 指纹在同秒内改文件会误判为无需重编 —— 判据是「输出里必须出现重编那一行」。
            - **macOS 分支的编译验证无法在本机完成**（Windows 上交叉编译缺 Apple 工具链，`cc-rs` 找不到 `cc`），相关改动只做过人工类型核对。这是已知局限，不是已验证。

            > 完整版本历史见仓库 README。
          releaseDraft: false
          prerelease: false
          release: true
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: |
            src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage
            src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage.sig
            src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/deb/*.deb

  # ---------- macOS (Apple Silicon) ----------
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install frontend deps
        run: npm ci --no-audit --no-fund
      - name: Build Tauri (macOS)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # v1.2.11：即使 macOS **不参与**应用内升级，也必须给签名私钥。
          # 原因：`bundle.createUpdaterArtifacts: true` 是全局配置，Tauri CLI 在
          # 任何平台看到它都会尝试产出 .app.tar.gz + .sig；没有私钥则构建**直接失败**
          # （不是跳过）。所以 mac 这里是「必须签名、但不进 latest.json」。
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          args: --ci --target aarch64-apple-darwin
          # mac 的 .app.tar.gz **绝不**进 latest.json：本项目 ad-hoc 签名，
          # 签名身份每次构建都变，TCC 授权（屏幕录制/辅助功能）会整体失效。
          includeUpdaterJson: false
          tagName: "v__VERSION__"
          releaseName: "v__VERSION__"
          releaseBody: |
            ### 屏幕时间管家 ScreenTime Pro — v1.2.12

            > **本版一次交付两个版本的内容**：v1.2.11 从未发布过（远端无该 tag），若跳过它，你从 v1.2.10 升上来就看不到「截完图闪退」已被修好的说明 —— 那是本版最该知道的一件事。所以本正文同时覆盖 v1.2.11 与 v1.2.12。

            ---

            ## 🔴 先说最重要的：macOS「截完图闪退」已修复

            **症状**：第一次截图只有半个屏幕，第二次截图正常，然后应用**整个消失** —— 没有报错弹窗，托盘图标也没了。

            **根因**（三层叠加，缺一不可）：

            1. **下载校验形同虚设**。增强取字引擎的运行库不随包（macOS / Linux），运行时从 Release 下载。旧实现里摘要校验在拉不到 `.sha256` 时**直接放行**，而下载只看 HTTP 200、不看字节数 —— 连接中途被切断时，一份残缺的运行库被当成下载成功。
            2. **落盘非原子**。直写目标路径，写到一半进程退出就留下半截文件；而「运行库是否就绪」只判断文件存在与否 —— 半截文件被认定为已就绪，**此后每次启动都崩**。
            3. **取字库的失败路径是 `expect(...)`**，而 release 构建配的是 `panic = "abort"`。第三方库一次内部断言失败 = `process::abort()`，没有任何错误出口可以捕获。

            **修法**（四层，缺一不可）：

            - **下载原子化**：先写 `.tmp` → 体积闸门（≥ 8MB）→ 摘要三态（匹配 / 不匹配 / 无从校验）→ **回读长度复核** → 原子 `rename`。不变式：目标路径要么不存在，要么是一份通过校验的完整文件。
            - **加载前自检**：新增运行库体检 —— 体积 + 平台魔数（PE / Mach-O / ELF）+ **真正 dlopen 一次并调 `OrtGetApiBase` / `GetApi`**。已损坏的缓存文件会被识别并删除，让存量用户**自动走出坑**，而不是继续崩。通过结果按（路径, 长度, mtime）缓存，不会每张截图都重复映射几十 MB 动态库。
            - **失败不再假报成功**：环境初始化在载入之前先体检，不合格直接返回错误且**不写「已就绪」标记**（旧实现里那一步完全不碰取字库的 API，所以「初始化通过」本身就是假信号）。
            - **进程不再被强制终止**：`panic` 由 `abort` 改回 **`unwind`**，并在取字的两个入口包 `catch_unwind`。即便将来第三方库在别处 panic，也只会让**本次取字报错**，应用继续运行。

            代价：安装包增大约 15%（unwind 表）。换的是不再有静默闪退。

            **顺带修掉一个更危险的分支**：如果本机缺 VC++ 运行库，随包的运行库会被旧的体检逻辑判成「文件损坏」并**删除** —— 而 Windows 没有下载通道，只能重装。现在「环境缺依赖」与「文件真坏了」分开判定：前者保留文件并提示装运行库，后者才删，且**只删我们自己下载的那份**，绝不动随包文件。

            ## 🔴 第二次：第一次截图只有半个屏幕

            抓屏本身是对的（日志两次都是 2560×1440）。真正原因是**启动事件丢了**。

            截图遮罩窗是**懒创建**的（首次截图才建，且先隐藏）。首次截图时界面正在从头加载整个前端，而事件是**即发即弃**的 —— 监听器还没注册，事件就被丢弃。于是遮罩拿不到屏幕尺寸，只能用窗口创建时的默认值（800×600）推算：全选只有半个屏，缩放比例算错，导出图尺寸跟着错。第二次截图时窗口已存在、页面就绪，所以「恢复正常」。

            **修法**：

            - 事件之外**再存一份**到后端状态，新增 `take_capture_ready` 命令，取走即清空。前端监听注册完成后**主动拉一次**兜底 —— 事件与拉取谁先到都不会重复初始化。
            - 去重判据从布尔值换成**后端自增的序号**。布尔值分不清「同一帧的重复投递」与「遮罩还开着时你又按了一次截图键」，后者会被当成重复而**吞掉新帧** —— 你框的是上一秒的画面，导出的却是这一秒的内容。
            - 初始化收敛成单一入口并做**代际守卫**，防止「用户已按 Esc 取消，上一轮异步结果回来又把画面写回去」。
            - 等待一次 DOM 更新 + 一帧渲染再取窗口几何 —— 窗口尺寸设置返回不代表界面已完成重排。
            - 选区与导出尺寸改用**载荷里的宽高**（而非窗口内宽），缩放比例优先用载荷的 `scale_factor`。窗口何时重排都不再影响选区。

            ## ✨ 新增：应用内自动升级（Windows / Linux AppImage）

            以前「发现新版本」只能跳浏览器手动下载。本版接入 Tauri 官方 updater：检查 → 下载 → **ed25519 验签** → 交给平台安装器，全程在应用内完成。

            - **Windows**：拉起 NSIS 安装包后**进程会立即退出**（upstream 在 `ShellExecuteW` 之后直接 `process::exit(0)`），安装器接管，装完自动重启。这不是崩溃。
            - **Linux（仅 AppImage）**：原地覆盖自身并自动重启。**deb / rpm 包不参与** —— 那两种走 `pkexec dpkg -i` / `rpm -U`，每次升级都要过一次系统授权框，本就应该由包管理器接手（`apt upgrade` / `dnf upgrade`）。应用会识别自己的包型，deb/rpm 用户点「检查更新」仍只会看到「前往下载」。
            - **签名不可关闭**：客户端硬编码公钥，只认用对应私钥签过的包。这条是安全底线，也是**私钥丢失 = 已安装用户永久收不到更新**的原因。

            ## ✨ 新增：桌宠拖拽跟手，重启后自己回来

            **拖动桌宠终于不掉队、不回跳。** 三处叠加的根因：

            1. **权限清单少一行**。桌宠窗口的权限里没有 `core:window:allow-start-dragging`，前端的系统级拖拽请求每次都被权限层拒绝，程序静默回退到「每帧跨进程搬一次窗口」。这意味着历史版本里那句「拖拽卡顿已根治」其实**从未生效** —— 修的是回退路径，入口一直是死的。
            2. **原生拖拽这条路走不通，三端都不用**。补上权限后在 Windows / Linux 上原生拖拽第一次真正生效，但随即发现它有个绕不过去的硬伤：**拿不到「松手」这个信号**。系统把拖拽交给 `DefWindowProc` 的模态移动循环，真实的 `WM_LBUTTONUP` 被它自己吃掉（底层库要在 `WM_EXITSIZEMOVE` 里手动补发一个），而这个补发事件并不会转发到网页层 —— 前端永远等不到 `pointerup`。于是改成**三端统一走新增的 Rust 侧拖拽循环**：按下时只记抓取偏移，之后每 8ms 由后端读**全局光标**自己搬窗，位移不足 4px 不发。这条路径 macOS 上已经用了几个版本，副作用是拖拽期最多每秒百余次**进程内**的位置投递（不是跨进程 IPC），实测跟手。
            3. **收尾位置取「自己发出的最后一个目标」而非查询窗口**。设位置是异步投递的，刚投的几帧还没落到系统里，去问只能问出历史值 —— 写进持久化就是「拖完回跳」。

            读全局光标这一点同时解决了旧写法的结构缺陷：鼠标一甩出宠物身体范围，网页就收不到移动事件，桌宠当场落后、松手又跳一下。

            **跨不同缩放比例的显示器也不跳了。** 拖拽全程改用**各平台自己的坐标空间**，缩放系数只在拖拽开始和结束各用一次，中间每秒百余次的位移计算里一次换算都没有。此前是「开始时除一次、设位置时又乘一次」，同一块屏上正好抵消，但宠物拖到另一块缩放比例不同的显示器上时两边用的系数就不是同一个了，位移会被等比放大。


            **重启后桌宠回来了。** 此前设置里明明开着，重启后宠物不出现、开关却还显示「开」，要进设置页关一次再开才出来。现在宠物窗口启动时会按持久化开关自动恢复尺寸与位置（顺序是「先定尺寸 → 再纠偏定位 → 最后显示」，反过来会先以默认尺寸露出一帧再撑大）。

            **不再把桌宠丢在屏幕外。** 拖出边缘允许，松手后自动回到看得见的位置；副屏拔掉或分辨率变化后重启，也不会恢复成离屏坐标。这套校验抽成了公共模块，与悬浮指标条**共用同一判据** —— 顺带补上它原先只查横向、不查纵向的漏洞（纵向甩出屏外原来一路放行）。

            **Linux 侧省掉高频建连。** 读鼠标位置此前每次都新建一条 X 连接（约每秒 18 次，加上拖拽循环还会再叠一条更高频的），现改为按线程缓存、连接失效自动重连。

            ## 🐞 修复：锁屏时间被计入使用时长

            锁屏界面（macOS `loginwindow`、Windows `LockApp` / `LogonUI`、Linux `gdm` / `sddm` 等）此前被当成普通应用统计。日志里 `loginwindow` 从 04:46 连续被记到 05:27，每小时都在涨。

            改为：命中即**结束当前会话**并跳过本次采样（与「无前台窗口」同等对待）。判据是**精确进程名**，刻意不用包含匹配 —— 按 `lock` 做包含匹配会把 `unlock-app`、`BlockchainWallet` 这类正常应用误杀成「不计时」。

            ## 🐞 修复：分类失败被写进永久缓存

            应用分类靠在线查询，失败时回落到「其他」。旧实现把这个回落值也写进了**永久缓存** —— 于是这条记录此后永远返回「其他」，网络恢复也不重试。日志里那批反复失败的应用名即此。

            改为**负缓存 + 10 分钟过期**：失败只进负缓存（避免断网时每次采样都打一次超时请求），过期自动重试；一旦拿到确定分类就清除负缓存。

            ## 🐞 修复：辅助功能已授权，应用却仍报「未授权」

            **症状**：系统设置 → 隐私与安全性 → 辅助功能里，本应用的开关**明明是开着的**，应用自己的设置页仍显示「辅助功能 ❌未授权」。

            **根因**（三层叠加，缺一不可）：

            1. **TCC 授权是按进程快照的**。用户把开关打开时应用正在运行，那个进程拿不到新授权 —— 必须重启进程才生效，但界面上没有任何引导。
            2. **ad-hoc 签名让授权记录指向「上一份二进制」**。CI 没有 `APPLE_SIGNING_IDENTITY`，每次构建的 cdhash 都不同；TCC 记录按「路径 + cdhash」绑定，于是升级后旧记录失效，而系统设置界面显示的仍是开关状态。
            3. **设置页的提示条件写反了**，且「重置」按钮只清屏幕录制、不清辅助功能 —— 文案说「重置并重启」，实际清的是另一个服务，用户白忙。

            **修法**：提示条件改正；重置按钮按服务分流（`tccutil reset Accessibility` / `ScreenCapture`）；辅助功能行也补上独立的重置入口；提示文案改为专门的辅助功能说明（不再与屏幕录制共用一条）。

            顺带确认：**辅助功能对本应用并非功能必需**。空闲检测用的是 `CGEventSourceSecondsSinceLastEventType`，不需要该权限；它只用于设置页的状态显示。所以即使不授权，计时本身是准的。

            ## ⚠️ 改动说明：磁盘占用百分比会变（是修复，不是回归）

            三端此前的口径不一致：Linux 按「普通用户可用空间」、macOS 按「含管理员保留块的空闲」、Windows 按「全盘空闲未扣配额」。同一块默认预留 5% 的 ext4 分区，在 Linux 上会显示得比另外两端**更满**。

            现统一为 `已用 = 总量 − 当前用户可用`。所以本版之后你在 Linux 上看到的磁盘百分比会比以前**低一点**，Windows / macOS 也可能有细微变化 —— 这是口径对齐的结果。

            多盘枚举的能力已经落到后端，但**界面上的多盘卡片本版还没接**。所以如果你有多块硬盘，只会看到口径变化，不会看到新卡片。

            ## 📌 已知局限（请务必先读）

            - **macOS 不参与自动升级**。两个独立理由：(a) ad-hoc 签名会让「升级后授权失效」每次都复发，自动升级等于把这个坑自动化；(b) `latest.json` 缺 macOS 条目时，updater 返回的是「找不到目标平台」这种硬错误而非「无更新」，会让 macOS 用户每次启动都在日志里刷一条错误。macOS 用户请继续从发布页下载 DMG，仍会照常提示「发现新版本」并给出下载链接。
            - **deb / rpm 包不参与自动升级**。用包管理器升级即可，应用会正确识别并只给下载链接。
            - **Windows 升级时进程会突然消失**，这是 NSIS 安装器接管的正常表现，不是崩溃。
            - **本版 macOS 侧改动仍未经真机目视复验**：拖拽跟手（快速横甩 400px 不掉队、不回跳）、重启后按上次位置恢复、离屏坐标落回可见区，这三条都需要在实体 Mac 上跑过才算数。权限中心文案在紧凑弹窗里是否被截断、截图遮罩在 Retina 屏上的实际观感同样未复验。若有不符请发截图到 issue。
            - **Windows / Linux 的拖拽观感未经长时间使用检验**：本版把原生拖拽整体换成了后端循环（原因见上），跟手度靠的是每秒百余次的进程内位置投递。开发机上短期拖动正常，但**尚未做过长时间、频繁拖拽的压力观察**，也没有与旧版原生拖拽做过并排对比。若你感觉不如以前顺滑，请反馈具体的屏幕缩放比例与显示器数量。
            - **跨缩放比例多屏的拖拽坐标已按代码逻辑修正，但未在异构 DPI 双屏上实测**：开发机是单一缩放比例，无法覆盖「宠物从 100% 屏拖到 150% 屏」这条路径。相关换算有单测对拍（往返无损），但单测证明不了观感。
            - **桌宠状态仍只存在本地浏览器存储里**，不在数据库备份范围内 —— 换设备或清理应用数据后，等级与喂食记录会丢。这是已知技术债，计划在后续版本迁移。

            ## ✅ 验证

            - `cargo test --lib` **61 passed / 0 failed / 5 ignored**（本版新增 21 个回归测试）/ `vue-tsc --noEmit` 零错误 / `vite build` 通过。
            - **`cargo clippy --all-targets` 与 `--lib` 同为 52 条且完全同集** —— 测试代码里不再多出任何告警，口径干净。这 52 条是既存基线，本版未新增。
            - **`panic = "unwind"` 在 release 配置下实测有效**：单独跑了一次 `cargo test --release`（`lto = true` 全量重编，约 14 分钟），结论是取字库内部的 panic 被 `catch_unwind` 捕获、测试以 `ok` 收尾。若有人把 `panic` 改回 `abort`，这个测试会让 test binary **硬崩**而不是 FAILED —— 这就是最强的回归信号。**注意：dev 档默认就是 unwind，只有 release 档跑过才算验证。**
            - **损坏运行库的判定做了双向锁定**：四类伪造样本（体积不足 / 魔数不对 / 截断 / 假文件）全部被拒；「缺依赖不等于文件损坏」与「只删自己下载的那份」各有独立测试，防止将来有人把破坏性分支改回去。
            - **截图序号单调性有独立测试**，锁死「同一帧不重复消费、新一轮必须刷新」。
            - **Linux 分支代码在 Windows 上被条件编译掉**，等于从未验证。已用「独立探针 crate 引真实源码」单独编译，并做**反证**（故意注入一个不存在的 API，确认报错而不是静默通过）。反证还踩到两个坑并记入文档：本机 `python` 是 Microsoft Store 占位程序会静默 no-op；cargo 的 mtime 指纹在同秒内改文件会误判为无需重编 —— 判据是「输出里必须出现重编那一行」。
            - **macOS 分支的编译验证无法在本机完成**（Windows 上交叉编译缺 Apple 工具链，`cc-rs` 找不到 `cc`），相关改动只做过人工类型核对。这是已知局限，不是已验证。

            > 完整版本历史见仓库 README。
          releaseDraft: false
          prerelease: false
          release: false
      - name: Inject Gatekeeper fix script into DMG
        # 当前构建无 Apple 签名/公证，用户打开会触发「已损坏」门禁提示。
        # 在 dmg 内注入一个 修复门禁.command：用户把 .app 拖入「应用程序」后，
        # 右键 → 打开 该脚本即可移除隔离属性（xattr -dr com.apple.quarantine），无需付费证书。
        # 脚本内联生成，不污染仓库。
        run: |
          set -e
          DMG=$(find src-tauri/target/aarch64-apple-darwin/release/bundle/dmg -name '*.dmg' | head -n1)
          echo "Found DMG: $DMG"
          hdiutil attach "$DMG" -mountpoint /tmp/stp_dmg -nobrowse -quiet
          rm -rf /tmp/stp_stage && mkdir -p /tmp/stp_stage
          cp -R /tmp/stp_dmg/. /tmp/stp_stage/
          cat > /tmp/stp_stage/修复门禁.command <<'SCRIPT'
          #!/bin/bash
          # 先移除脚本自身的隔离属性（若本脚本本身也被 Gatekeeper 拦截）
          xattr -d com.apple.quarantine "$0" 2>/dev/null || true
          APP="/Applications/ScreenTime Pro.app"
          if [ -d "$APP" ]; then
            xattr -dr com.apple.quarantine "$APP"
            osascript -e 'display dialog "已移除 ScreenTime Pro 的隔离属性，现在可以直接打开。" buttons {"好"} default button "好"' >/dev/null 2>&1
          else
            osascript -e 'display dialog "未找到 ScreenTime Pro.app。请先把应用拖入「应用程序」文件夹，再运行本脚本。" buttons {"好"} default button "好"' >/dev/null 2>&1
          fi
          SCRIPT
          chmod +x /tmp/stp_stage/修复门禁.command
          # 同时注入一份中文说明，讲清为什么被拦截、如何使用脚本或手动命令
          cat > /tmp/stp_stage/首次打开必读.txt <<'README'
          ============================================================
          ScreenTime Pro — 首次打开「已损坏 / 无法验证开发者」怎么办？
          ============================================================

          【为什么会有这个提示？】
          本应用目前没有购买 Apple 开发者证书做「公证(Notarization)」，
          因此 macOS 的 Gatekeeper 会把从网络下载的应用标记为隔离(quarantine)，
          首次打开时会提示「已损坏，无法打开」或「无法验证开发者」。
          这不是 App 本身有问题，只是系统的安全策略。

          【解决办法一（最省事，推荐）】
          1. 先把「ScreenTime Pro.app」拖进「应用程序」文件夹。
          2. 在 DMG 里【右键】「修复门禁.command」→ 选「打开」。
             ⚠️ 必须右键→打开才会看到「打开」按钮；直接双击会被系统拦截。
          3. 脚本会自动执行 xattr -dr com.apple.quarantine，弹窗提示成功后即可正常打开 App。

          【解决办法二（手动命令）】
          打开「终端」，粘贴并执行（-r 递归，确保 App 内部文件也一并清除隔离属性）：
            xattr -dr com.apple.quarantine "/Applications/ScreenTime Pro.app"
          若提示「No such xattr」，说明已无隔离属性，直接打开即可。

          处理一次之后，今后打开 App 都不再被拦截。
          README
          hdiutil detach /tmp/stp_dmg -quiet
          hdiutil create -volname "ScreenTime Pro" -srcfolder /tmp/stp_stage -ov -format UDZO "$DMG"
          echo "Injected 修复门禁.command + 首次打开必读.txt into DMG"
      - name: Upload injected DMG to Release (overwrite stale one)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          TAG="${{ github.ref_name }}"
          DMG=$(find src-tauri/target/aarch64-apple-darwin/release/bundle/dmg -name '*.dmg' | head -n1)
          echo "Injected DMG: $DMG"
          # Release 由 Windows/Linux job 创建；若尚未就绪，最多等待 ~5 分钟
          for i in $(seq 1 30); do
            if gh release view "$TAG" >/dev/null 2>&1; then break; fi
            echo "Release $TAG 尚未就绪，等待 10s ($i/30)..."
            sleep 10
          done
          gh release upload "$TAG" "$DMG" --clobber
          echo "Re-uploaded injected DMG to Release $TAG"
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-build
          path: |
            src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg

  # ---------- 汇总生成 latest.json（v1.2.11 新增）----------
  #
  # 为什么必须单独一个作业：
  #   tauri-action 的 `includeUpdaterJson`（默认 true）会用**本 runner 产出的那一个
  #   平台**写一份 latest.json 传到 Release。本项目三台 runner 并行跑同一个 tag，
  #   三份 latest.json 互相覆盖，最终线上只剩最后完成的那一个平台的条目 ——
  #   另外两个平台 check() 会拿到 Err(TargetsNotFound)（updater.rs:637），
  #   界面上表现为「检查更新失败」而不是「已是最新」。
  #   所以三个构建作业都设 includeUpdaterJson: false，由本作业收齐后上传唯一一份。
  #
  # ⚠️ 平台键必须与 updater 的查找顺序严格一致（updater.rs:618-626）：
  #   先找 `{os}-{arch}-{installer}`，再退 `{os}-{arch}`；arch 用 updater 自己的
  #   命名（x86_64 / aarch64 / i686 / armv7），**不是** Node 的 x64 / arm64；
  #   installer 是 `Installer::name()` 的小写值（appimage / deb / rpm / msi / nsis）。
  #   - Windows nsis   → windows-x86_64-nsis
  #   - Linux AppImage → linux-x86_64-appimage
  #   - macOS 故意不写：见 src-tauri/src/app_update.rs 模块头「为什么 macOS 必须关闭」
  #
  # ⚠️ `signature` 必须是 .sig 文件的**内容**，不是路径、不是 URL。
  #   写成路径的话客户端会验签失败，且报错发生在下载完之后，用户已经白等一次。
  updater-json:
    needs: [windows, linux]
    runs-on: ubuntu-24.04
    steps:
      # 🔴 v1.2.12 修复：本作业缺 checkout，导致仓库文件根本不在 runner 上。
      # 现象：`python3: can't open file '.../gen_latest_json.py': No such file or directory`。
      # 这个作业是 v1.2.11 新增的，**从未成功跑过一次**（v1.2.10 的 run 里没有它，
      # 而 v1.2.11 因签名密钥缺失整个 CI 没起来）。新增作业最容易漏的就是 checkout ——
      # download-artifact 只把「构建产物」放下来，不含任何仓库源码。
      - uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-artifacts

      - name: Generate latest.json
        env:
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          echo "--- 收到的产物 ---"
          find dist-artifacts -type f | sort
          # 🔴 v1.2.12 修复：不能直接用 `github.ref_name` 当 tag。
          # tag 推送时它是 `v1.2.12`（正确）；但 `workflow_dispatch` 下它是**分支名**
          # `main` —— 于是 latest.json 会写出 …/releases/download/main/… 的死链，
          # 且 `version` 被脚本 `lstrip('vV')` 变成 `main`，客户端 semver 解析直接失败。
          # 版本号唯一可信来源是 package.json（发版时与 tauri.conf.json 同步）。
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF_NAME}"
            echo "tag 触发，TAG=$TAG"
          else
            VER="$(python3 -c "import json;print(json.load(open('package.json',encoding='utf-8'))['version'])")"
            TAG="v$VER"
            echo "非 tag 触发（${GITHUB_REF}），按 package.json 归一化 TAG=$TAG"
          fi
          export TAG
          # ⚠️ PUB_DATE 必须是严格 RFC3339（Z 结尾）：updater 用
          # `OffsetDateTime::parse(..., Rfc3339)` 反序列化，格式不对会让客户端
          # 检查更新直接失败（updater.rs:1479-1484 把解析错误转成 DeError）。
          # 这里用构建时刻，而不是 github.event.repository.updated_at ——
          # 后者在评论区变动时也会更新，与「发布时刻」无关。
          export PUB_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "pub_date=$PUB_DATE"
          python3 .github/scripts/gen_latest_json.py dist-artifacts latest.json

      - name: Upload latest.json to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          # 与上一步同源：TAG 优先取真实 tag，dispatch 下退化为 package.json 版本。
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            VER="$(python3 -c "import json;print(json.load(open('package.json',encoding='utf-8'))['version'])")"
            TAG="v$VER"
          fi
          echo "上传目标 tag=$TAG"
          # Release 由构建作业创建；并行时可能尚未就绪，最多等 ~5 分钟。
          for i in $(seq 1 30); do
            if gh release view "$TAG" >/dev/null 2>&1; then break; fi
            echo "Release $TAG 尚未就绪，等待 10s ($i/30)..."
            sleep 10
          done
          gh release view "$TAG" >/dev/null 2>&1 || {
            echo "::error::Release $TAG 在等待 5 分钟后仍不存在"; exit 1; }
          gh release upload "$TAG" latest.json --clobber
          echo "已上传 latest.json（tag=$TAG）"
