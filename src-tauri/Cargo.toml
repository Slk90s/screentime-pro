[package]
name = "screentime-pro"
version = "0.1.0"
description = "跨平台应用使用时长追踪工具"
authors = ["Ryan"]
edition = "2021"
# v1.2.11：1.77 → **1.77.2**。`tauri-plugin-updater` 的 MSRV 决定了这个下界。
# 本字段只是声明，不会阻止解析，但声明低于依赖的 MSRV 属于**事实错误** —— 后续
# 有人想用 1.77.0 构建时，报错会出现在依赖编译阶段而不是这里，排查成本高。
# CI 用 stable，不受影响。
#
# ⚠️ 这个值必须与下面 `tauri-plugin-updater` 的**锁定版本**配套看：updater 在
# 2.13.0 把 MSRV 从 1.77.2 抬到了 **1.90**（同时 edition 2021 → 2024），所以本项目
# 钉死 `=2.12.0`。若哪天放开版本上限，这里也要跟着抬到 1.90。
rust-version = "1.77.2"

[lib]
name = "screentime_pro_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
# v0.6.0-beta 桌宠透明窗口需要 macos-private-api（macOS 透明窗体依赖 NSWindow 私有 API）
tauri = { version = "2.0.0", features = ["macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
chrono = { version = "0.4", features = ["serde"] }
rusqlite = { version = "0.32", features = ["bundled"] }
# 分类规则引擎的正则匹配
regex = "1"
# 跨平台获取本机电脑名（用于默认设备名称，而非默认设备 ID）
gethostname = "0.5"
# 开机自启插件（跨平台：macOS LaunchAgent / Windows 注册表 / Linux systemd --user）
tauri-plugin-autostart = "2"
# v1.0.1：单实例锁 —— 修复 macOS「关机自启动后又手动打开 → 两个实例同时记录」。
# 必须在 Builder 上**第一个**注册（官方要求），重复启动时新进程退出、把已运行实例主窗拉到前台。
tauri-plugin-single-instance = "2"
# 跨平台后台定时任务（采样循环）
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
# 检查更新：拉取 GitHub Releases API（用 rustls 避开 native openssl 依赖）
#
# v1.2.10（2026-10-26）：补 `system-proxy`。这是「检测不到更新」的**第三个成因**，
# 且是唯一一个纯代码改动就能修的：
#   `default-features = false` 会连带关掉 reqwest 默认集里的 `system-proxy`
#   （reqwest-0.12.28/Cargo.toml:101-106 的 default 含它），于是 reqwest 只读
#   `HTTP_PROXY` / `HTTPS_PROXY` / `ALL_PROXY` 环境变量（hyper-util 的
#   `Builder::from_env`），**不读操作系统代理设置**。
#   macOS 的系统代理在「系统设置 → 网络 → 代理」里，Clash / Surge 等 GUI 客户端
#   默认就是改那里而不是设环境变量 —— 于是国内用户开着代理时，三条通道全部
#   直连出境 → 全灭 → 前端提示「已是最新」。这解释了为什么部分用户
#   「浏览器能开 GitHub，应用却检测不到更新」。
#   代价：macOS 多依赖 system-configuration、Windows 多依赖 windows-registry
#   （各一个纯系统绑定 crate，无额外 TLS/运行时）。
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
    "blocking",
    "system-proxy",
] }
# 自动归类引擎的 LRU 缓存（容量 256，进程名 → 分类 ID）
lru = "0.12"
# ===== v1.2.11（2026-10-27）：应用内自动升级（Tauri 官方 updater）=====
#
# 为什么现在才引：v1.2.4 起只有「自实现的版本检查」（GitHub atom → REST → Gitee
# 三通道 + 首页横幅 + 跳浏览器下载）。用户反馈「自动更新三个平台都没有」——
# 查明后确认**不是坏了，是这个功能从未实现**（详见 docs/ARCHITECTURE.md 的更新章节）。
#
# ⚠️ 三条硬约束（决定了下游所有实现方式，改动前必读）：
# ① **必须签名**，不可关闭。签名用 ed25519，公钥写进 tauri.conf.json 的
#    `plugins.updater.pubkey`，私钥只在 CI 环境变量里。私钥丢失 = 已安装用户
#    **永远无法**再收到更新（客户端只认这一把公钥）。
# ② **Linux 三种包型行为不同，必须按 `bundle_type()` 分流**（源码
#    updater.rs:1046 的 `install_inner`）：
#      - AppImage → `install_appimage`：原地覆盖自身，静默，无需提权；
#      - Deb     → `install_deb`：写临时包后 `pkexec dpkg -i`（弹图形授权），
#                  失败退到 zenity/kdialog 取密码，再退到终端 `sudo`；
#      - Rpm     → `install_rpm`：同上，命令为 `rpm -U`。
#    三者都**不会**自动重启进程（只有 Windows 会，见 ③），装完必须应用自己 relaunch。
#    ⚠️ Deb/Rpm 走 pkexec 意味着**每次升级都弹一次系统授权框**，且要求 polkit 可用
#    （无桌面 polkit 的发行版会直接失败）。所以对 deb/rpm 用户，更稳妥的是继续用
#    系统包管理器 / 下载新包；本项目按 `updater_supported` 只对 AppImage 开放应用内升级。
# ③ **Windows 安装后进程立即退出**：`install_inner` 用 ShellExecuteW 拉起安装包后
#    直接 `std::process::exit(0)`（updater.rs:876）。所以 `install()` **没有机会**
#    返回给调用方 —— 前端不能写「安装成功后弹提示」，那句提示永远不会执行。
# ④ **缺 target 会报错而不是静默**。若 latest.json 里没有当前平台的
#    `{os}-{arch}[-{installer}]` 条目，`check()` 返回 `Err(TargetsNotFound)` 而非
#    `Ok(None)`（已核对上游源码 `get_urls()`:608-638）。所以 macOS 不产出更新包时，
#    **不能**让它去查同一个 latest.json，否则 mac 用户每次启动都刷一条错误日志。
#
# 版本锁定：**必须写 `=`**。2.13.0 起 edition 2024 + rust 1.90 + 依赖 tauri 2.12，
# 而本项目是 tauri 2.11.5 / rust 1.77.2；裸写 `"2"` 会因为 semver 被解析到 2.14.x，
# 直接拉崩 tauri 版本并抬高 MSRV。2.12.0 是最后一个「tauri 2.10 + rust 1.77.2」版本。
tauri-plugin-updater = "=2.12.0"
# 「安装完立即重启」需要 process 插件的 relaunch。Rust 侧其实可直接
# app.restart()（本仓库已有 restart_app 命令），但 updater 的 JS API 在
# downloadAndInstall 之后推荐 relaunch() —— 本项目走 Rust 侧编排，不用 JS API，
# 因此**不引入** @tauri-apps/plugin-updater / plugin-process 前端包。

# ===== 日志系统（v0.4.2 引入）=====
# tracing 生态：结构化日志、span、采样；按级别过滤
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "registry"] }
# 文件输出 + 非阻塞写入（生产环境必备，避免日志 IO 卡住 UI）
tracing-appender = "0.2"
# Tauri 官方日志插件：把 Rust + 前端日志统一到同一文件，提供前端 invoke 调用
tauri-plugin-log = "2"
# 对话框插件（备份路径选择文件夹对话框）
tauri-plugin-dialog = "2"
# 跨平台回收站：把「上一份」备份移入系统回收站（Windows 回收站 / macOS 废纸篓 / Linux 桌面 trash）
trash = "5"
# v0.7.6：跨平台网络采样（macOS getifaddrs 需要；Windows/Linux 暂不直接用，但保留以便统一跨平台 FFI 调用）
libc = "0.2"
xcap = "0.9"
arboard = "3"
base64 = "0.22"
# 增强引擎运行时库按需下载（macOS / Linux 不随包，首次使用时后台静默拉取）的 SHA256 校验
sha2 = "0.10"
image = { version = "0.25", default-features = false, features = ["png"] }
tauri-plugin-global-shortcut = "2"
# ⚠️ 精确 pin：ort 是 RC 预发布版，Cargo 对 pre-release 的兼容规则会把
# "2.0.0-rc.13" 解析到更新的 rc（rc.14 起breaking：Environment 必须显式 build 传参），
# 曾导致 v1.1.0 三平台 CI 全挂（E0599 commit 不存在 / E0061 builder 缺参）。
# 升级 rc.14+ 时须同步改 ocr_onnx.rs 的 ensure_env / Session::builder 三处调用。
ort = { version = "=2.0.0-rc.13", features = ["load-dynamic"] }
ndarray = "0.17.2"
# v1.2.2（2026-10-21）：悬浮窗液态玻璃的系统材质。
# ⚠️ 必须显式声明 0.8.1：tauri 2.11.5 内部锁 window-vibrancy "0.6"（只有 NSVisualEffectMaterial，
# 没有任何 liquid glass API）。0.8.1 才提供 apply_liquid_glass / LiquidGlassOptions。
# 谱系核对：0.8.1 用 windows-sys 0.60/0.61（锁文件已有 0.60.2/0.61.2）+ objc2 0.6 /
# objc2-app-kit 0.3.2（与本项目完全同代）→ 不新增版本谱系、不重复编译 objc2。
# 代价：0.6.0 仍会被 tauri 拉入依赖树，有两份 window-vibrancy（体积增量可接受）。
window-vibrancy = "0.8.1"

# ---- macOS 专属依赖（对齐 Tauri 2.x 引入的 objc2 0.6，避免重复编译）----
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
# v1.2.2：液态玻璃需要 NSGlassEffectView（macOS 26 的公开 AppKit API），0.3.2 已内置
# 该 feature，这里只是开启，不触发版本升级。
# ⚠️ 不引入 objc2-web-kit：apply_liquid_glass 的 content_view()（重父化 WKWebView）
# 方案已放弃（理由见 float_glass.rs 落地注意 #4），故无需直接依赖取 webview 指针。
objc2-app-kit = { version = "0.3", features = [
    "NSWorkspace",
    "NSRunningApplication",
    "NSApplication",
    "NSGlassEffectView",
    "NSView",
] }

# features 显式列全（默认也是开着的，但写清楚就不用担心将来有人关掉 default）
# NSEnumerator 是 `Retained<NSArray<T>>: IntoIterator` 的前提；NSData 用于把 PNG 交给 Vision。
objc2-foundation = { version = "0.3", features = [
    "NSString",
    "NSURL",
    "NSArray",
    "NSData",
    "NSDictionary",
    "NSError",
    "NSEnumerator",
] }
# 系统 Vision framework 绑定 = macOS 的「标准」取字引擎（ocr_vision.rs）。
# ⚠️ 版本必须与上面的 objc2 0.6 同代（0.3.x 配 0.6），否则会同时编译两份 objc2。
objc2-vision = "0.3"
# 前台窗口标题采集（CGWindowListCopyWindowInfo，需「屏幕录制」权限）
# 用底层 core-foundation-sys 直接调 C 函数，规避 core-foundation 0.10 高层 API 变更
core-foundation-sys = "0.8"
core-foundation = "0.10"
core-graphics = "0.24"
# v0.9.4（Task 80）：ScreenCaptureKit 安全绑定 —— macOS 14+ 的现代截图引擎。
# 为什么引入：xcap 底层走 `CGWindowListCreateImage`（Apple 已标记废弃的旧 API），
# 未授权时不报错只给「壁纸图」；SCK 的 `SCScreenshotManager` 未授权时**真报错**，
# 且 `SCShareableContent::get()` 是触发系统授权弹窗最可靠的方式。
# ⚠️ 构建期会跑 swift build（需要 Xcode CLT，macOS CI 自带）；运行期最低 macOS 13，
#    截图 API 实际要 macOS 14+（运行时检测，低版本自动回落 xcap，见 macos_sck.rs）。
screencapturekit = { version = "10.0.3", features = ["macos_14_0"] }

# ---- Windows 专属依赖 ----
[target.'cfg(target_os = "windows")'.dependencies]
# v1.2.2：原先为液态玻璃引入 windows-version（按 build 号判 Acrylic 可用性）。
# 真机实测后 Windows 侧改为纯 CSS 高透光、不再调系统材质，本依赖已无使用点，
# 故移除（避免留一个只在注释里存在的依赖）。详见 float_glass.rs 模块头。
# v0.8.0（2026-09-16）：0.58 → 0.62。截图引擎 xcap 0.9.8 已拉 windows 0.62，
# 继续锁 0.58 会让依赖树同时编译两份 windows crate（体积与编译时间双损）。
# 升到 0.62 后与 xcap 共用同一份，且 Media_Ocr（v0.8.x 本地 OCR）也在此版本内。
windows = { version = "0.62", features = [
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_System_ProcessStatus",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Threading",
  "Win32_Foundation",
  "Win32_System_SystemInformation",
  # v0.7.6：网络采样（GetIfTable2 + MIB_IF_TABLE2 需要 Ndis 常量 IF_TYPE_*/MIB_IF_OPER_STATUS_*）
  "Win32_NetworkManagement_IpHelper",
  "Win32_NetworkManagement_Ndis",
  # v0.7.7：磁盘采样（GetDiskFreeSpaceExW）；内存的 GlobalMemoryStatusEx 属
  # Win32_System_SystemInformation，该特性上方已启用
  "Win32_Storage_FileSystem",
  # v0.8.1：截图取字（本地 OCR，全部离线、不走任何外部接口）
  # - Media_Ocr：OcrEngine / OcrResult
  # - Graphics_Imaging：SoftwareBitmap / BitmapPixelFormat（OCR 只吃 Bgra8）
  # - Storage_Streams：DataWriter 造 IBuffer（SoftwareBitmap 要从内存造，没有别的路）
  # - Globalization：Language（用户语言包不含 OCR 时的降级语言）
  # - Win32_System_Com：CoInitializeEx —— WinRT 激活要求本线程已初始化 COM，
  #   而 async 命令跑在 tokio 线程池上，默认没有 → 必须自己初始化
  "Media_Ocr",
  "Graphics_Imaging",
  "Storage_Streams",
  "Globalization",
  "Foundation",
  "Win32_System_Com",
] }
# 跨平台调用系统默认浏览器（用于打开 WebView2 下载页）
open = "5"

# ---- Linux 专属依赖 ----
# x11rb：纯 Rust XCB 协议实现（无需系统 X11 库即可交叉编译；运行时需 X Display）
# resource_manager：读取 _NET_ACTIVE_WINDOW 等 EWMH 属性所需的原子名缓存
[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13", default-features = false, features = ["resource_manager"] }

[features]
# 默认启用 Tauri 自定义协议 + 系统托盘（关闭窗口时最小化到托盘而非退出）
default = ["custom-protocol", "tauri/tray-icon"]
custom-protocol = ["tauri/custom-protocol"]

# ===== release 构建体积优化（2026-10-22 @v1.2.5）=====
# 依据 Tauri v2 官方 App Size 文档（https://v2.tauri.app/concept/size/）的推荐配置原样落地。
# 此前本文件没有任何 [profile.release]，即全部走 Rust 默认值
# （opt-level=3 / lto=false / codegen-units=16 / panic=unwind / 不 strip），
# 实测 exe 23.3 MB（.text 13.6 MB + .rdata 9.4 MB）。
#
# 逐项说明与前置条件核对：
# - codegen-units = 1：让 LLVM 做全程序优化。代价是编译变慢（并行度下降），
#   但本项目发版走 CI，本地只偶尔构建，可接受。
# - lto = true：跨 crate 内联与死代码消除，对依赖树重（tauri / rusqlite / ort / xcap）的项目收益最明显。
# - opt-level = "s"：优先体积。官方说想要速度用 3；本项目是常驻托盘的小工具，
#   热点只有 1Hz 采样与 IPC，`"s"` 的体积收益大于性能损失。
# - panic = "abort"：去掉 unwind 表。
#   ⚠️ 前置条件：代码中不得依赖 catch_unwind 捕获 panic。已全仓核查
#   `grep -rn catch_unwind src-tauri/src` → 0 处，安全。
# - strip = true：移除符号表。
#   ⚠️ 前置条件核查：现有 exe 已无 .debug 节（PE 节表仅 .text/.rdata/.data/.pdata/.rsrc/.reloc），
#   且 bundle 不打包 .pdb → 本项收益小，但零风险，按官方推荐保留。
#
# ⚠️ 若将来需要线上调试崩溃，临时改回 `panic = "unwind"` + `strip = false` 再构建。
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
